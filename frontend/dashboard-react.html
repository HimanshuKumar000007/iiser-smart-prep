<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - SmartPrep</title>
    <script>
      (function() {
        var token = localStorage.getItem('IAT_TOKEN');
        if (!token || token === 'undefined' || token === 'null' || token.trim() === '') {
          localStorage.removeItem('IAT_TOKEN');
          var dest = window.location.pathname + window.location.search;
          window.location.replace('/login.html?redirect=' + encodeURIComponent(dest));
        }
      })();
    </script>
    <script src="/config.js" defer></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
