<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tutor — IISER Smart Prep</title>
    <meta name="description"
        content="Ask any IISER IAT doubt instantly. AI-powered tutor for Physics, Chemistry, Math and Biology.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0f1117;
        }

        /* Gradient background */
        .bg-gradient-main {
            background: radial-gradient(ellipse at top left, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at bottom right, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
                #0f1117;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .message-bubble {
            animation: slideIn 0.25s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .typing-indicator span {
            animation: blink 1.4s infinite both;
            display: inline-block;
            width: 7px;
            height: 7px;
            background-color: #818cf8;
            border-radius: 50%;
            margin: 0 2px;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 0.2;
            }

            50% {
                opacity: 1;
            }
        }

        .code-block {
            position: relative;
        }

        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .code-block:hover .copy-btn {
            opacity: 1;
        }

        /* Custom scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.3);
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.5);
        }

        /* Input auto-grow */
        textarea {
            overflow-y: hidden;
        }

        /* Prose styling for AI output */
        .ai-content h1,
        .ai-content h2,
        .ai-content h3 {
            color: #e2e8f0;
            font-weight: 600;
            margin: 0.75em 0 0.4em;
        }

        .ai-content p {
            color: #cbd5e1;
            margin: 0.4em 0;
            line-height: 1.7;
        }

        .ai-content ul,
        .ai-content ol {
            padding-left: 1.4em;
            color: #cbd5e1;
        }

        .ai-content li {
            margin: 0.25em 0;
        }

        .ai-content code:not(pre code) {
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 0.88em;
        }

        .ai-content pre {
            background: #1e1e2e !important;
            border-radius: 10px;
            margin: 0.75em 0;
            overflow-x: auto;
        }

        .ai-content blockquote {
            border-left: 3px solid #6366f1;
            padding-left: 1em;
            color: #94a3b8;
            margin: 0.5em 0;
        }

        .ai-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 0.75em 0;
        }

        .ai-content th,
        .ai-content td {
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.4em 0.75em;
            color: #cbd5e1;
        }

        .ai-content th {
            background: rgba(99, 102, 241, 0.15);
            color: #e2e8f0;
        }

        /* Send button pulse when active */
        @keyframes pulse-ring {
            0% {
                box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4);
            }

            70% {
                box-shadow: 0 0 0 8px rgba(99, 102, 241, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(99, 102, 241, 0);
            }
        }

        #sendBtn:not(:disabled):hover {
            animation: pulse-ring 1s ease-out;
        }

        /* Suggestion chips */
        .chip {
            border: 1px solid rgba(99, 102, 241, 0.4);
            background: rgba(99, 102, 241, 0.08);
            transition: all 0.2s;
        }

        .chip:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.7);
            transform: translateY(-1px);
        }
    </style>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WHHM4FTNHG"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-WHHM4FTNHG');
    </script>
</head>

<body class="bg-gradient-main text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="glass-panel sticky top-0 z-50 border-b border-white/[0.06]">
        <div class="max-w-3xl mx-auto px-4 py-3 flex items-center gap-3">
            <a href="/frontend/index.html" class="text-slate-400 hover:text-white transition-colors mr-1" title="Home">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
            </a>
            <div
                class="w-8 h-8 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center shadow-lg flex-shrink-0">
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                </svg>
            </div>
            <div>
                <h1 class="font-semibold text-sm text-white leading-tight">IISER AI Tutor</h1>
                <p class="text-xs text-slate-500">Ask any IAT doubt — Physics, Chem, Math, Bio</p>
            </div>
            <div class="ml-auto flex items-center gap-1.5">
                <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>
                <span class="text-xs text-slate-500" id="usageCounter">30 left today</span>
            </div>
        </div>
    </header>

    <!-- Chat Area -->
    <main class="flex-1 max-w-3xl mx-auto w-full px-4 py-6 flex flex-col gap-4">

        <div id="chatContainer" class="flex-1 flex flex-col gap-5 min-h-[60vh] overflow-y-auto custom-scrollbar pb-2">

            <!-- Welcome -->
            <div id="welcomeBlock" class="flex flex-col items-center justify-center py-10 gap-6 text-center">
                <div
                    class="w-16 h-16 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center shadow-2xl">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                    </svg>
                </div>
                <div>
                    <h2 class="text-2xl font-bold text-white mb-1">Hi, I'm your IAT Tutor 👋</h2>
                    <p class="text-slate-400 text-sm">Ask me anything about Physics, Chemistry, Math or Biology</p>
                </div>
                <!-- Suggestion Chips -->
                <div class="flex flex-wrap gap-2 justify-center max-w-lg">
                    <button onclick="useChip(this)"
                        class="chip text-xs text-indigo-300 px-3 py-1.5 rounded-full cursor-pointer">
                        Explain quantum numbers 🔬
                    </button>
                    <button onclick="useChip(this)"
                        class="chip text-xs text-indigo-300 px-3 py-1.5 rounded-full cursor-pointer">
                        Solve: integrate x²·eˣ dx 📐
                    </button>
                    <button onclick="useChip(this)"
                        class="chip text-xs text-indigo-300 px-3 py-1.5 rounded-full cursor-pointer">
                        What is Hardy-Weinberg equilibrium? 🧬
                    </button>
                    <button onclick="useChip(this)"
                        class="chip text-xs text-indigo-300 px-3 py-1.5 rounded-full cursor-pointer">
                        Difference between SN1 and SN2 ⚗️
                    </button>
                    <button onclick="useChip(this)"
                        class="chip text-xs text-indigo-300 px-3 py-1.5 rounded-full cursor-pointer">
                        What topics come in IISER IAT? 📝
                    </button>
                </div>
            </div>

        </div>

        <!-- Input Box -->
        <div class="glass-panel rounded-2xl p-3 border border-white/[0.08] sticky bottom-4">
            <div class="flex gap-2 items-end">
                <textarea id="userInput" rows="1" placeholder="Ask any IAT doubt..."
                    class="flex-1 bg-transparent border-none outline-none text-white placeholder-slate-500 resize-none custom-scrollbar text-sm py-2 px-2"
                    onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
                <button onclick="sendMessage()" id="sendBtn"
                    class="bg-gradient-to-br from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white p-2.5 rounded-xl transition-all transform hover:scale-105 disabled:opacity-40 disabled:cursor-not-allowed disabled:scale-100 shadow-lg flex-shrink-0">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                </button>
            </div>
            <p class="text-xs text-slate-600 px-2 pt-1">Enter to send · Shift+Enter for new line</p>
        </div>
    </main>

    <script>
        // ─────────────────────────────────────────────
        //  CONFIGURATION — API key is safe on the server
        // ─────────────────────────────────────────────
        const AI_CONFIG = {
            // Calls our own backend proxy — DeepSeek key never exposed to browser
            url: 'https://api.iisersmartprep.space/api/ai-chat',
            systemPrompt: `You are an expert AI tutor for the IISER IAT (Indian Institutes of Science Education and Research Aptitude Test). 
You help Indian students with Physics, Chemistry, Mathematics and Biology at Class 11-12 level. 
Give clear, concise explanations. Use LaTeX-style notation where helpful. 
Be encouraging and supportive. If asked about topics outside IAT, still answer helpfully.`
        };

        // ─────────────────────────────────────────────
        //  State
        // ─────────────────────────────────────────────
        let messages = [{ role: 'system', content: AI_CONFIG.systemPrompt }];
        let isStreaming = false;

        // ─────────────────────────────────────────────
        //  Chip click
        // ─────────────────────────────────────────────
        function useChip(btn) {
            const text = btn.innerText.replace(/[🔬📐🧬⚗️📝]/gu, '').trim();
            document.getElementById('userInput').value = text;
            sendMessage();
        }

        // ─────────────────────────────────────────────
        //  Input helpers
        // ─────────────────────────────────────────────
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 180) + 'px';
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        // ─────────────────────────────────────────────
        //  Send message
        // ─────────────────────────────────────────────
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const content = input.value.trim();

            if (!content || isStreaming) return;

            // Hide welcome block on first message
            const welcome = document.getElementById('welcomeBlock');
            if (welcome) welcome.remove();

            // Add user bubble
            appendBubble(content, true);
            messages.push({ role: 'user', content });
            input.value = '';
            input.style.height = 'auto';

            // Typing indicator
            showTyping();
            isStreaming = true;
            sendBtn.disabled = true;

            try {
                const fullText = await streamResponse();
                messages.push({ role: 'assistant', content: fullText });
            } catch (err) {
                removeTyping();
                appendErrorBubble(err.message);
            } finally {
                isStreaming = false;
                sendBtn.disabled = false;
            }
        }

        // ─────────────────────────────────────────────
        //  Stream response from DeepSeek
        // ─────────────────────────────────────────────
        async function streamResponse() {
            const response = await fetch(AI_CONFIG.url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    messages: messages
                })
            });

            if (!response.ok) {
                const err = await response.json().catch(() => ({}));
                // User-friendly message for rate limit
                if (response.status === 429) {
                    throw new Error(err.error || '🌙 You\'ve used all 30 questions for today. Come back tomorrow!');
                }
                throw new Error(err.error || `Error ${response.status}: ${response.statusText}`);
            }

            // Update usage counter from server header
            const remaining = response.headers.get('X-Daily-Remaining');
            if (remaining !== null) {
                const counter = document.getElementById('usageCounter');
                if (counter) {
                    const n = parseInt(remaining);
                    counter.textContent = `${n} left today`;
                    counter.style.color = n <= 5 ? '#f87171' : n <= 10 ? '#fb923c' : '';
                }
            }

            removeTyping();

            // Create AI bubble
            const container = document.getElementById('chatContainer');
            const bubble = createAIBubble();
            const contentDiv = bubble.querySelector('.ai-content');
            container.appendChild(bubble);

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let fullText = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const lines = decoder.decode(value).split('\n');
                for (const line of lines) {
                    if (!line.trim() || line.trim() === 'data: [DONE]') continue;
                    if (line.startsWith('data: ')) {
                        try {
                            const data = JSON.parse(line.slice(6));
                            const chunk = data.choices?.[0]?.delta?.content || '';
                            if (chunk) {
                                fullText += chunk;
                                contentDiv.innerHTML = marked.parse(fullText);
                                contentDiv.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
                                addCopyButtons(contentDiv);
                                container.scrollTop = container.scrollHeight;
                            }
                        } catch { }
                    }
                }
            }

            container.scrollTop = container.scrollHeight;
            return fullText;
        }

        // ─────────────────────────────────────────────
        //  DOM helpers
        // ─────────────────────────────────────────────
        function appendBubble(text, isUser) {
            const container = document.getElementById('chatContainer');
            const bubble = document.createElement('div');
            bubble.className = `message-bubble flex ${isUser ? 'justify-end' : 'justify-start'}`;
            bubble.innerHTML = isUser
                ? `<div class="max-w-[78%] bg-indigo-600/80 backdrop-blur rounded-2xl rounded-tr-sm px-4 py-2.5 text-sm text-white">${escapeHtml(text)}</div>`
                : ``;
            container.appendChild(bubble);
            container.scrollTop = container.scrollHeight;
            return bubble;
        }

        function createAIBubble() {
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble flex justify-start gap-3';
            bubble.innerHTML = `
                <div class="w-7 h-7 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-lg flex items-center justify-center flex-shrink-0 mt-0.5 shadow">
                    <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                    </svg>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="ai-content text-sm overflow-x-auto"></div>
                </div>`;
            return bubble;
        }

        function appendErrorBubble(msg) {
            const container = document.getElementById('chatContainer');
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble flex justify-start';
            bubble.innerHTML = `
                <div class="max-w-[78%] bg-red-900/40 border border-red-500/30 rounded-2xl px-4 py-2.5 text-sm text-red-300">
                    ⚠️ ${escapeHtml(msg)}
                </div>`;
            container.appendChild(bubble);
            container.scrollTop = container.scrollHeight;
        }

        function showTyping() {
            const container = document.getElementById('chatContainer');
            const el = document.createElement('div');
            el.id = 'typingIndicator';
            el.className = 'message-bubble flex justify-start gap-3';
            el.innerHTML = `
                <div class="w-7 h-7 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-lg flex items-center justify-center flex-shrink-0 shadow">
                    <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                    </svg>
                </div>
                <div class="typing-indicator flex items-center gap-1 py-2">
                    <span></span><span></span><span></span>
                </div>`;
            container.appendChild(el);
            container.scrollTop = container.scrollHeight;
        }

        function removeTyping() {
            document.getElementById('typingIndicator')?.remove();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function addCopyButtons(container) {
            container.querySelectorAll('pre').forEach(pre => {
                if (pre.querySelector('.copy-btn')) return;
                const btn = document.createElement('button');
                btn.className = 'copy-btn bg-slate-700 hover:bg-slate-600 text-slate-300 px-2 py-1 rounded text-xs transition-all';
                btn.textContent = 'Copy';
                btn.onclick = () => {
                    navigator.clipboard.writeText(pre.querySelector('code')?.textContent || '');
                    btn.textContent = 'Copied!';
                    setTimeout(() => btn.textContent = 'Copy', 2000);
                };
                pre.classList.add('code-block');
                pre.style.position = 'relative';
                pre.appendChild(btn);
            });
        }
    </script>

</body>

</html>
