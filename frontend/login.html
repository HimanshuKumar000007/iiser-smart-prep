<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    if (localStorage.getItem('IAT_TOKEN')) {
      window.location.replace('dashboard-react/index.html');
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | IISER Smart Prep</title>
  <meta name="description" content="Login or sign up to IISER Smart Prep — AI-powered preparation platform for IISER IAT.">
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" href="/favicon-96x96.png" type="image/png">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta property="og:image" content="https://iisersmartprep.space/web-app-manifest-512x512.png">
  <meta property="og:title" content="Login | IISER Smart Prep">
  <meta property="og:description" content="AI Powered IISER IAT Preparation Platform">
  <meta name="theme-color" content="#eef4fb">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #4f7cff;
      --primary-dark: #3b66db;
      --accent: #8b5cf6;
      --cyan: #22d3ee;
      --bg: #eef4fb;
      --bg-soft: #f7f9fc;
      --panel: #ffffff;
      --panel-2: #f1f5f9;
      --border: rgba(15, 23, 42, 0.08);
      --border-strong: rgba(15, 23, 42, 0.12);
      --text: #0f172a;
      --text-dim: #475569;
      --text-faint: #64748b;
      --error: #ef4444;
      --success: #10b981;
      --grad-primary: linear-gradient(135deg, #4f7cff 0%, #8b5cf6 55%, #22d3ee 100%);
      --radius: 20px;
      --radius-sm: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient background glow */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background:
        radial-gradient(
          circle at 20% 10%,
          rgba(79, 124, 255, 0.08),
          transparent 60%
        ),
        radial-gradient(
          circle at 80% 50%,
          rgba(139, 92, 246, 0.06),
          transparent 60%
        );
      pointer-events: none;
      z-index: 0;
    }

    /* ── Card ── */
    .auth-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 460px;
      padding: 1.5rem;
    }

    .auth-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2.5rem;
      box-shadow: 0 20px 50px -15px rgba(15, 23, 42, 0.08);
      animation: cardIn 0.5s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Brand ── */
    .brand {
      text-align: center;
      margin-bottom: 2rem;
    }
    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      font-family: 'Space Grotesk', sans-serif;
    }
    .brand-icon {
      width: 32px; height: 32px;
      background: var(--grad-primary);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.95rem;
      font-weight: 700;
      color: white;
    }
    .brand-name {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.5px;
    }
    .brand-name span {
      background: var(--grad-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ── Tab Switcher ── */
    .tab-switcher {
      display: flex;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 2rem;
      gap: 4px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--text-dim);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
    }
    .tab-btn.active {
      background: var(--grad-primary);
      color: white;
      box-shadow: 0 4px 15px rgba(79, 124, 255, 0.2);
    }

    /* ── Heading ── */
    .page-heading { text-align: center; margin-bottom: 1.75rem; }
    .page-heading h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.5px;
      margin-bottom: 0.35rem;
    }
    .page-heading p {
      font-size: 0.9rem;
      color: var(--text-dim);
    }

    /* ── Form ── */
    .form-group { margin-bottom: 1.25rem; }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 0.5rem;
    }

    .input-wrapper {
      position: relative;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      opacity: 0.6;
      pointer-events: none;
    }
    .eye-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-faint);
      font-size: 1rem;
      padding: 0;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    .eye-toggle:hover { opacity: 1; }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 0.85rem 0.9rem 0.85rem 2.6rem;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      color: var(--text);
      transition: all 0.2s;
      -webkit-appearance: none;
    }
    input::placeholder { color: rgba(15, 23, 42, 0.35); }
    input:focus {
      outline: none;
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(79, 124, 255, 0.12);
    }
    input[type="password"] { padding-right: 2.8rem; }

    /* ── Forgot link ── */
    .forgot-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 6px;
    }
    .forgot-link {
      font-size: 0.82rem;
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    .forgot-link:hover { color: var(--primary-dark); text-decoration: underline; }

    /* ── Submit Button ── */
    .btn-submit {
      width: 100%;
      padding: 0.9rem;
      background: var(--grad-primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 1.25rem;
      position: relative;
      overflow: hidden;
      transition: all 0.25s;
      box-shadow: 0 4px 18px rgba(79, 124, 255, 0.25);
      letter-spacing: 0.2px;
    }
    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(79, 124, 255, 0.35);
    }
    .btn-submit:active { transform: translateY(0); }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .btn-submit .btn-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* Loading spinner */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error / Success msg ── */
    .msg-box {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      text-align: center;
      display: none;
      animation: fadeIn 0.2s ease;
    }
    .msg-box.error {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: var(--error);
    }
    .msg-box.success {
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: var(--success);
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }

    /* ── Back link ── */
    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--text-faint);
      text-decoration: none;
      transition: color 0.2s;
      font-weight: 500;
    }
    .back-link:hover { color: var(--primary); }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 1.25rem 0;
      color: var(--text-faint);
      font-size: 0.78rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Password strength */
    .strength-bar {
      display: flex;
      gap: 4px;
      margin-top: 8px;
    }
    .strength-seg {
      flex: 1;
      height: 4px;
      border-radius: 4px;
      background: rgba(15, 23, 42, 0.06);
      transition: background 0.3s;
    }

    /* Form slide animation */
    .form-panel {
      animation: slideIn 0.3s cubic-bezier(0.16,1,0.3,1);
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(8px); }
      to   { opacity: 1; transform: translateX(0); }
    }
  </style>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WHHM4FTNHG"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-WHHM4FTNHG');
  </script>
</head>

<body>
  <div class="auth-wrapper">
    <div class="auth-card">

      <!-- Brand -->
      <div class="brand">
        <a href="index.html" class="brand-logo">
          <div class="brand-icon">IS</div>
          <span class="brand-name">IISER <span>Smart Prep</span></span>
        </a>
      </div>

      <!-- Tab Switcher -->
      <div class="tab-switcher">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Log In</button>
        <button class="tab-btn" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
      </div>

      <!-- LOGIN FORM -->
      <div id="panel-login" class="form-panel">
        <div class="page-heading">
          <h2>Welcome back 👋</h2>
          <p>Login to access your dashboard</p>
        </div>
        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label>Email Address</label>
            <div class="input-wrapper">
              <span class="input-icon">✉️</span>
              <input type="email" id="login-email" placeholder="you@example.com" required autocomplete="email">
            </div>
          </div>
          <div class="form-group">
            <label>Password</label>
            <div class="input-wrapper">
              <span class="input-icon">🔒</span>
              <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
              <button type="button" class="eye-toggle" onclick="togglePwd('login-password',this)">👁️</button>
            </div>
            <div class="forgot-row">
              <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
            </div>
          </div>
          <div class="msg-box error" id="login-error"></div>
          <button type="submit" class="btn-submit" id="login-btn">
            <span class="btn-inner">
              <div class="spinner" id="login-spin"></div>
              <span id="login-btn-text">Log In →</span>
            </span>
          </button>
        </form>
      </div>

      <!-- SIGNUP FORM -->
      <div id="panel-signup" class="form-panel" style="display:none;">
        <div class="page-heading">
          <h2>Create account ✨</h2>
          <p>Join the smartest way to prep for IAT</p>
        </div>
        <form id="signupForm" onsubmit="handleSignup(event)">
          <div class="form-group">
            <label>Full Name</label>
            <div class="input-wrapper">
              <span class="input-icon">👤</span>
              <input type="text" id="signup-name" placeholder="Your full name" required autocomplete="name">
            </div>
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <div class="input-wrapper">
              <span class="input-icon">✉️</span>
              <input type="email" id="signup-email" placeholder="you@example.com" required autocomplete="email">
            </div>
          </div>
          <div class="form-group">
            <label>Password</label>
            <div class="input-wrapper">
              <span class="input-icon">🔒</span>
              <input type="password" id="signup-password" placeholder="Min. 8 characters" required oninput="checkStrength(this.value)" autocomplete="new-password">
              <button type="button" class="eye-toggle" onclick="togglePwd('signup-password',this)">👁️</button>
            </div>
            <div class="strength-bar">
              <div class="strength-seg" id="s1"></div>
              <div class="strength-seg" id="s2"></div>
              <div class="strength-seg" id="s3"></div>
              <div class="strength-seg" id="s4"></div>
            </div>
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <div class="input-wrapper">
              <span class="input-icon">🔒</span>
              <input type="password" id="signup-confirm" placeholder="••••••••" required autocomplete="new-password">
              <button type="button" class="eye-toggle" onclick="togglePwd('signup-confirm',this)">👁️</button>
            </div>
          </div>
          <div class="msg-box error" id="signup-error"></div>
          <div class="msg-box success" id="signup-success"></div>
          <button type="submit" class="btn-submit" id="signup-btn">
            <span class="btn-inner">
              <div class="spinner" id="signup-spin"></div>
              <span id="signup-btn-text">Create Account →</span>
            </span>
          </button>
        </form>
      </div>

      <a href="index.html" class="back-link">← Back to Home</a>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    const API_BASE = typeof API_BASE_URL !== 'undefined' ? API_BASE_URL : 'https://api.iisersmartprep.space/api';

    // Check URL ?mode=signup
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('mode') === 'signup') switchTab('signup');

    function switchTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('tab-login').classList.toggle('active', isLogin);
      document.getElementById('tab-signup').classList.toggle('active', !isLogin);
      document.getElementById('panel-login').style.display  = isLogin ? 'block' : 'none';
      document.getElementById('panel-signup').style.display = isLogin ? 'none' : 'block';
      // Re-trigger animation
      const panel = document.getElementById(isLogin ? 'panel-login' : 'panel-signup');
      panel.classList.remove('form-panel');
      void panel.offsetWidth;
      panel.classList.add('form-panel');
    }

    function togglePwd(id, btn) {
      const inp = document.getElementById(id);
      if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
      else { inp.type = 'password'; btn.textContent = '👁️'; }
    }

    function checkStrength(val) {
      const segs = [document.getElementById('s1'),document.getElementById('s2'),document.getElementById('s3'),document.getElementById('s4')];
      let score = 0;
      if (val.length >= 8)  score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;
      const colors = ['#ef4444','#f97316','#eab308','#22c55e'];
      segs.forEach((s,i) => s.style.background = i < score ? colors[score-1] : 'rgba(15,23,42,0.06)');
    }

    function showMsg(id, msg, type='error') {
      const el = document.getElementById(id);
      el.className = `msg-box ${type}`;
      el.textContent = msg;
      el.style.display = 'block';
    }
    function hideMsg(id) { document.getElementById(id).style.display = 'none'; }

    function setLoading(btnId, spinId, textId, loading, text) {
      document.getElementById(btnId).disabled = loading;
      document.getElementById(spinId).style.display = loading ? 'block' : 'none';
      document.getElementById(textId).textContent = text;
    }

    async function handleLogin(e) {
      e.preventDefault();
      hideMsg('login-error');
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      setLoading('login-btn','login-spin','login-btn-text', true, 'Logging in...');
      try {
        const res = await fetch(`${API_BASE}/login`, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({email, password})
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');
        clearOldProgressData();
        localStorage.setItem('IAT_TOKEN', data.token);
        
        try {
          const profileRes = await fetch(`${API_BASE}/me`, {
            headers: { 'Authorization': 'Bearer ' + data.token }
          });
          if (profileRes.ok) {
            const profileData = await profileRes.json();
            if (profileData.name) {
              localStorage.setItem('currentUser', profileData.name);
            }
          }
        } catch (_) {}

        const initialPlan = (data.plan || data.user?.plan || 'FREE').toUpperCase();
        localStorage.setItem('IAT_PLAN', initialPlan);
        // Invalidate cache so this login always checks DB for real plan
        localStorage.removeItem('IAT_PLAN_SYNCED_AT');
        // Show redirecting state immediately so user sees feedback
        setLoading('login-btn','login-spin','login-btn-text', true, 'Redirecting...');
        // Re-sync plan from DB with a 3-second timeout — never blocks the redirect
        try {
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 3000);
          const planRes = await fetch(`${API_BASE}/check-pro-status`, {
            headers: { 'Authorization': 'Bearer ' + data.token },
            signal: controller.signal
          });
          clearTimeout(timeout);
          if (planRes.ok) {
            const planData = await planRes.json();
            if (planData.plan) localStorage.setItem('IAT_PLAN', planData.plan.toUpperCase());
          }
          // Stamp sync time so homepage doesn't re-check immediately
          localStorage.setItem('IAT_PLAN_SYNCED_AT', String(Date.now()));
        } catch(_) { /* timeout or network error — plan already set from login response */ }
        const redirect = new URLSearchParams(window.location.search).get('redirect');
        window.location.href = redirect ? decodeURIComponent(redirect) : 'index.html';
      } catch(err) {
        showMsg('login-error', err.message, 'error');
        setLoading('login-btn','login-spin','login-btn-text', false, 'Log In →');
      }
    }

    async function handleSignup(e) {
      e.preventDefault();
      hideMsg('signup-error');
      hideMsg('signup-success');
      const name = document.getElementById('signup-name').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;
      const confirm = document.getElementById('signup-confirm').value;
      if (password !== confirm) return showMsg('signup-error', 'Passwords do not match!');
      if (password.length < 8) return showMsg('signup-error', 'Password must be at least 8 characters');
      setLoading('signup-btn','signup-spin','signup-btn-text', true, 'Creating account...');
      try {
        const res = await fetch(`${API_BASE}/signup`, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({name, email, password})
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Signup failed');
        clearOldProgressData();
        localStorage.setItem('IAT_TOKEN', data.token);
        if (name) localStorage.setItem('currentUser', name);
        const plan = (data.user?.plan || 'FREE').toUpperCase();
        localStorage.setItem('IAT_PLAN', plan);
        showMsg('signup-success', '🎉 Account created! Redirecting...', 'success');
        setTimeout(() => { window.location.href = 'index.html'; }, 1200);
      } catch(err) {
        showMsg('signup-error', err.message, 'error');
        setLoading('signup-btn','signup-spin','signup-btn-text', false, 'Create Account →');
      }
    }

    function clearOldProgressData() {
      const preserveKeys = [
        'onboarding_exam',
        'onboarding_level',
        'onboarding_days',
        'onboarding_hours',
        'onboarding_strong',
        'onboarding_weak',
        'onboarding_completed'
      ];
      const savedOnboarding = {};
      preserveKeys.forEach(k => {
        const val = localStorage.getItem(k);
        if (val !== null) savedOnboarding[k] = val;
      });
      localStorage.clear();
      Object.keys(savedOnboarding).forEach(k => {
        localStorage.setItem(k, savedOnboarding[k]);
      });
    }
  </script>
</body>
</html>
