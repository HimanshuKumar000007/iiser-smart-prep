<head>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap');

    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-mono: #3b82f6;
      /* Blue for Monera */
      --accent-prot: #8b5cf6;
      /* Purple for Protista */
      --accent-fungi: #f59e0b;
      /* Amber for Fungi */
      --accent-plant: #10b981;
      /* Emerald for Plantae */
      --accent-animal: #ef4444;
      /* Red for Animalia */
      --accent-virus: #ec4899;
      /* Pink for Viruses */
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --line-color: #334155;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow-x: hidden;
    }

    /* Tree Connector Lines */
    .tree-node {
      position: relative;
      padding-left: 2rem;
      border-left: 2px solid var(--line-color);
      margin-left: 1rem;
    }

    .tree-node:last-child {
      border-left: 2px solid transparent;
    }

    .tree-node::before {
      content: "";
      position: absolute;
      left: -2px;
      top: 0;
      width: 2rem;
      height: 2rem;
      border-bottom: 2px solid var(--line-color);
      border-left: 2px solid var(--line-color);
      border-bottom-left-radius: 8px;
    }

    .tree-node:first-child::before {
      top: 1.5rem;
      height: calc(100% - 1.5rem);
    }

    /* Root node adjustments */
    .root-node {
      border-left: none;
      padding-left: 0;
      margin-left: 0;
    }

    .root-node::before {
      display: none;
    }

    /* Node Cards */
    .node-card {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .node-card:hover {
      transform: translateX(5px);
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    .node-card.active {
      border-color: var(--accent-mono);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
    }

    .node-card::after {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 4px;
      background: var(--accent-mono);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .node-card:hover::after {
      opacity: 1;
    }

    /* Kingdom Specific Colors */
    .kingdom-monera .node-card::after {
      background: var(--accent-mono);
    }

    .kingdom-protista .node-card::after {
      background: var(--accent-prot);
    }

    .kingdom-fungi .node-card::after {
      background: var(--accent-fungi);
    }

    .kingdom-plantae .node-card::after {
      background: var(--accent-plant);
    }

    .kingdom-animalia .node-card::after {
      background: var(--accent-animal);
    }

    .kingdom-virus .node-card::after {
      background: var(--accent-virus);
    }

    .kingdom-monera .node-card.active {
      border-color: var(--accent-mono);
    }

    .kingdom-protista .node-card.active {
      border-color: var(--accent-prot);
    }

    .kingdom-fungi .node-card.active {
      border-color: var(--accent-fungi);
    }

    .kingdom-plantae .node-card.active {
      border-color: var(--accent-plant);
    }

    .kingdom-animalia .node-card.active {
      border-color: var(--accent-animal);
    }

    .kingdom-virus .node-card.active {
      border-color: var(--accent-virus);
    }

    /* Toggle Button */
    .toggle-btn {
      transition: transform 0.3s;
    }

    .toggle-btn.collapsed {
      transform: rotate(-90deg);
    }

    /* Search Highlight */
    .highlight {
      background: rgba(234, 179, 8, 0.3);
      border-radius: 2px;
      padding: 0 2px;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-dark);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--line-color);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    /* Content Formatting */
    .content-text {
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--text-muted);
    }

    .content-text strong {
      color: var(--text-main);
      font-weight: 600;
    }

    .content-text ul {
      margin-top: 0.5rem;
      padding-left: 1.2rem;
    }

    .content-text li {
      margin-bottom: 0.3rem;
      position: relative;
    }

    .content-text li::marker {
      color: var(--accent-mono);
    }

    /* Animations */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.5s ease-out forwards;
    }

    /* Badge */
    .badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
    }
  </style>
  <base target="_blank">
</head>

                                        Notochord present at some stage. Dorsal hollow nerve cord. Pharyngeal gill slits. Post-anal tail.<br>
                                        <strong>Cephalochordata:</strong> Notochord persists. <em>Amphioxus (Lancelet).</em><br>
                                        <strong>Urochordata:</strong> Notochord in tail only (larva). <em>Ascidia, Salpa.</em><br>
                                        <strong>Vertebrata:</strong> Notochord replaced by vertebral column.<br>
                                        • <strong>Cyclostomata:</strong> Jawless fish. Ectoparasites. <em>Petromyzon (Lamprey).</em><br>
                                        • <strong>Chondrichthyes:</strong> Cartilaginous fish. Placoid scales. 5-7 pairs gills. <em>Scoliodon, Trygon.</em><br>
                                        • <strong>Osteichthyes:</strong> Bony fish. Operculum. Air bladder. <em>Exocoetus (Flying fish), Hippocampus (Sea horse).</em><br>
                                        • <strong>Amphibia:</strong> Cold-blooded. 3-chambered heart. Cutaneous respiration. <em>Frog, Salamander.</em><br>
                                        • <strong>Reptilia:</strong> Cold-blooded. 3-chambered (4 in croc). Scales. <em>Naja (Cobra), Crocodile.</em><br>
                                        • <strong>Aves:</strong> Warm-blooded. 4-chambered heart. Feathers. Forelimbs wings. <em>Struthio (Ostrich - flightless), Pavo (Peacock).</em><br>
                                        • <strong>Mammalia:</strong> Warm-blooded. 4-chambered heart. Hair. Mammary glands. <em>Kangaroo (Marsupial), Platypus (Oviparous), Bat (Flying).</em>
                                    `
                }
              ]
            }
          ]
        },
        {
          id: "atypical",
          title: "Atypical Biological Entities",
          icon: "⚠️",
          type: "branch",
          content: "Organisms/systems on the borderline of living/non-living or symbiotic associations.",
          children: [
            {
              id: "viruses",
              title: "Viruses",
              icon: "👾",
              type: "kingdom-virus",
              content: "Non-cellular, obligate parasites. Crystallizable (non-living outside host).",
              children: [
                {
                  title: "Structure",
                  icon: "🔬",
                  content: `
                                        <strong>Capsid:</strong> Protein coat (capsomeres).<br>
                                        <strong>Nucleoid:</strong> Genetic material (DNA or RNA, never both).<br>
                                        <strong>Envelope:</strong> Lipid + Protein (derived from host cell membrane, in some viruses like HIV, Influenza).<br>
                                        <strong>Enzyme:</strong> Reverse transcriptase (Retroviruses).

                {
                  title: "Replication",
                  icon: "🔄",
                  content: `
                                        <strong>Lytic Cycle:</strong> Virulent. Immediate replication → host lysis.<br>

                {

                  content: `
                                        <strong>Plant Viruses:</strong> TMV (Tobacco Mosaic), generally RNA viruses.<br>
                                        <strong>Animal Viruses:</strong> Polio, HIV (Retrovirus), Influenza, Herpes, generally DNA viruses (except Retro).<br>
                                        <strong>Bacteriophages:</strong> T2, T4, Lambda (λ). Infect bacteria. Polyhedral head + helical tail.

              ]

            {
              id: "viroids",
              title: "Viroids",
              icon: "🧬",

              content: "Discovered by T.O. Diener (1971). Smaller than viruses. Only <strong>RNA</strong> (no protein coat). Infectious. Cause potato spindle tuber disease."

            {
              id: "prions",

              type: "kingdom-virus",
              content: "Proteinaceous infectious particles. <strong>Only protein</strong> (no nucleic acid). Discovered by Stanley Prusiner. Cause BSE (Bovine Spongiform Encephalopathy/Mad Cow Disease), CJD (Creutzfeldt-Jakob Disease) in humans."

    // Render Functions
    function createNodeElement(node, level = 0) {
      const div = document.createElement('div');
      div.className = `tree-node ${level === 0 ? 'root-node' : ''} ${node.type || ''}`;
      div.id = `node-${node.id}`;

      // Card Container
      const card = document.createElement('div');
      card.className = 'node-card rounded-xl p-4 mb-4 animate-fade-in';
      card.style.animationDelay = `${level * 0.1}s`;

      // Header
      const header = document.createElement('div');
      header.className = 'flex items-center justify-between mb-2';

      const titleSection = document.createElement('div');
      titleSection.className = 'flex items-center gap-3';

      // Icon
      const icon = document.createElement('span');
      icon.className = 'text-2xl';
      icon.textContent = node.icon || '📄';

      // Title
      const title = document.createElement('h3');
      title.className = 'font-bold text-lg text-white';
      title.textContent = node.title;

      titleSection.appendChild(icon);
      titleSection.appendChild(title);

      // Controls
      const controls = document.createElement('div');
      controls.className = 'flex items-center gap-2';

      if (node.children && node.children.length > 0) {
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = `${node.children.length} topics`;
        controls.appendChild(badge);

        const toggleBtn = document.createElement('button');
        toggleBtn.className = 'toggle-btn w-8 h-8 rounded-full bg-slate-700 hover:bg-slate-600 flex items-center justify-center transition-colors';
        toggleBtn.innerHTML = '<i class="fas fa-chevron-down text-slate-300"></i>';
        toggleBtn.onclick = (e) => {
          e.stopPropagation();
          toggleChildren(node.id);
        };
        controls.appendChild(toggleBtn);
      }

      header.appendChild(titleSection);
      header.appendChild(controls);
      card.appendChild(header);

      // Content
      if (node.content) {
        const content = document.createElement('div');
        content.className = 'content-text mt-2';
        content.innerHTML = node.content;
        card.appendChild(content);
      }

      // Click to focus
      card.onclick = () => {
        document.querySelectorAll('.node-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
      };

      div.appendChild(card);

      // Children Container
      if (node.children && node.children.length > 0) {
        const childrenContainer = document.createElement('div');
        childrenContainer.id = `children-${node.id}`;
        childrenContainer.className = 'children-container';

        node.children.forEach(child => {
          childrenContainer.appendChild(createNodeElement(child, level + 1));
        });

        div.appendChild(childrenContainer);
      }

      return div;
    }

    function toggleChildren(nodeId) {
      const container = document.getElementById(`children-${nodeId}`);
      const btn = document.querySelector(`#node-${nodeId} .toggle-btn`);

      if (container) {
        const isHidden = container.style.display === 'none';
        container.style.display = isHidden ? 'block' : 'none';

        if (btn) {
          if (isHidden) {
            btn.classList.remove('collapsed');
            btn.innerHTML = '<i class="fas fa-chevron-down text-slate-300"></i>';
          } else {
            btn.classList.add('collapsed');
            btn.innerHTML = '<i class="fas fa-chevron-right text-slate-300"></i>';
          }
        }
      }
    }

    // Search Functionality
    function searchNodes(query) {
      const normalizedQuery = query.toLowerCase().trim();
      const allCards = document.querySelectorAll('.node-card');

      // Clear previous highlights
      document.querySelectorAll('.highlight').forEach(el => {
        const parent = el.parentNode;
        parent.replaceChild(document.createTextNode(el.textContent), el);
        parent.normalize();
      });

      if (!normalizedQuery) {
        allCards.forEach(card => {
          card.style.display = 'block';
          card.style.opacity = '1';
        });
        return;
      }

      allCards.forEach(card => {
        const text = card.innerText.toLowerCase();
        const match = text.includes(normalizedQuery);

        if (match) {
          card.style.display = 'block';
          card.style.opacity = '1';

          // Highlight text
          const walker = document.createTreeWalker(card, NodeFilter.SHOW_TEXT, null, false);
          const textNodes = [];
          while (walker.nextNode()) {
            if (walker.currentNode.textContent.toLowerCase().includes(normalizedQuery)) {
              textNodes.push(walker.currentNode);
            }
          }

          textNodes.forEach(node => {
            const span = document.createElement('span');
            const regex = new RegExp(`(${normalizedQuery})`, 'gi');
            span.innerHTML = node.textContent.replace(regex, '<span class="highlight">$1</span>');
            node.parentNode.replaceChild(span, node);
          });

          // Expand parents
          let parent = card.parentElement;
          while (parent) {
            if (parent.classList.contains('tree-node')) {
              const id = parent.id.replace('node-', '');
              const childrenContainer = document.getElementById(`children-${id}`);
              if (childrenContainer) {
                childrenContainer.style.display = 'block';
                const btn = parent.querySelector('.toggle-btn');
                if (btn) {
                  btn.classList.remove('collapsed');
                  btn.innerHTML = '<i class="fas fa-chevron-down text-slate-300"></i>';
                }
              }
            }
            parent = parent.parentElement;
          }

          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
          card.style.opacity = '0.3';
        }
      });
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('mindmap-container');
      container.appendChild(createNodeElement(mindMapData));

      // Search listener
      const searchInput = document.getElementById('searchInput');
      let debounceTimer;
      searchInput.addEventListener('input', (e) => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => searchNodes(e.target.value), 300);
      });
    });
  </script>
