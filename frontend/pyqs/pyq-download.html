<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloading PDF | IISER Smart Prep</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --primary-soft: #e0e7ff;
            --secondary: #0f172a;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --bg-white: #ffffff;
            --bg-wash: #f8fafc;
            --border: #e2e8f0;
            --success: #10b981;
            --radius-md: 12px;
            --radius-pill: 100px;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            background: var(--bg-wash);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }

        .download-card {
            background: white;
            padding: 3rem 2rem;
            border-radius: var(--radius-md);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
            border: 1px solid var(--border);
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: var(--primary-soft);
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1.5rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.4);
            }

            70% {
                box-shadow: 0 0 0 15px rgba(79, 70, 229, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(79, 70, 229, 0);
            }
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--secondary);
        }

        p {
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .file-info {
            background: var(--bg-wash);
            padding: 1rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            text-align: left;
        }

        .file-icon {
            font-size: 1.5rem;
            color: var(--success);
        }

        .file-details h4 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .file-details span {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-pill);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            gap: 0.5rem;
            text-decoration: none;
            width: 100%;
            margin-bottom: 0.75rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
        }

        .btn-outline {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .progress-bar {
            height: 4px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 2rem;
            width: 100%;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.1s linear;
        }
    </style>
<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-WHHM4FTNHG"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-WHHM4FTNHG');
</script>
</head>

<body>
    <div class="download-card">
        <div class="icon-box">
            <i class="fas fa-arrow-down"></i>
        </div>
        <h1>Your download is starting...</h1>
        <p>Your study material is being prepared.</p>

        <div class="file-info">
            <div class="file-icon"><i class="fas fa-file-pdf"></i></div>
            <div class="file-details">
                <h4 id="fileName">IAT Question Paper</h4>
                <span id="fileMeta">Calculating size...</span>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>

        <p style="font-size: 0.875rem; margin-bottom: 1rem;">If download doesn't start automatically:</p>
        <button class="btn btn-primary" onclick="manualDownload()">
            <i class="fas fa-download"></i> Download Manually
        </button>
        <a href="pyq.html" class="btn btn-outline">
            <i class="fas fa-arrow-left"></i> Back to PYQs
        </a>
    </div>

    <script>
        // Get params
        const urlParams = new URLSearchParams(window.location.search);
        const year = urlParams.get('year') || '2025';
        const type = urlParams.get('type') || 'combined';

        // Update UI
        const typeLabel = type === 'combined' ? 'Question Paper + Solutions' :
            (type === 'solutions' ? 'Solutions' : 'Question Paper');
        document.getElementById('fileName').textContent = `IAT ${year} ${typeLabel}`;
        document.getElementById('fileMeta').textContent = 'PDF • Premium Quality';

        // Simulate Download Progress
        const progress = document.getElementById('progress');
        let width = 0;
        const interval = setInterval(() => {
            if (width >= 100) {
                clearInterval(interval);
                triggerDownload();
            } else {
                width += 2;
                progress.style.width = width + '%';
            }
        }, 30); // 1.5 seconds

        function triggerDownload() {
            // In real app, this would be window.location.href = api_url
            // Here we just update the title or show alert
            document.querySelector('h1').textContent = "Download Complete!";
            document.querySelector('.icon-box').innerHTML = '<i class="fas fa-check"></i>';
            document.querySelector('.icon-box').style.background = '#dcfce7';
            document.querySelector('.icon-box').style.color = '#10b981';
            document.querySelector('.icon-box').style.animation = 'none';
        }

        function manualDownload() {
            triggerDownload();
        }
    </script>
</body>

</html>
