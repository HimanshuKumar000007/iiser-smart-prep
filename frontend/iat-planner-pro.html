<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IISER IAT 2026 Sprint | Real Performance Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;600;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg-primary: #050507;
            --bg-secondary: #0a0a0f;
            --bg-card: rgba(15, 15, 25, 0.7);
            --accent-purple: #6366f1;
            --accent-pink: #ec4899;
            --accent-cyan: #06b6d4;
            --accent-green: #22c55e;
            --accent-orange: #f59e0b;
            --accent-red: #ef4444;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --glass-border: rgba(255, 255, 255, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 100px;
            line-height: 1.6;
        }

        .bg-mesh {
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.12), transparent 40%),
                radial-gradient(circle at 80% 20%, rgba(236, 72, 153, 0.08), transparent 40%);
            pointer-events: none;
        }

        .app-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(5, 5, 7, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: 1rem;
        }

        .header-content {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        .brand-text h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .brand-text span {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .header-actions {
            display: flex;
            gap: 0.5rem;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: var(--bg-secondary);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.25rem;
        }

        .icon-btn:hover {
            background: var(--glass-border);
            transform: translateY(-2px);
        }

        .icon-btn.recording {
            animation: pulse-rec 1.5s infinite;
            background: rgba(239, 68, 68, 0.2);
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        @keyframes pulse-rec {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
            }

            50% {
                box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);
            }
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 1.5rem 1rem;
        }

        .date-strip-container {
            margin-top: 1rem;
            margin-bottom: 2rem;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .date-strip-container::-webkit-scrollbar {
            display: none;
        }

        .date-strip-card {
            display: flex;
            gap: 0.75rem;
            padding-bottom: 0.5rem;
        }

        .date-item {
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            min-width: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .date-item.active {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--accent-purple);
        }

        .date-day {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }

        .date-item.active .date-day {
            color: var(--accent-purple);
        }

        .date-num {
            font-size: 1.25rem;
            font-weight: 800;
            font-family: 'Space Grotesk';
        }

        .date-month {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .stats-overview {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        @media (min-width: 640px) {
            .stats-overview {
                grid-template-columns: 2fr 1fr 1fr;
            }
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.25rem;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .stat-card.primary {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(99, 102, 241, 0.05));
            border-color: rgba(99, 102, 241, 0.2);
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stat-value-large {
            font-size: 2.2rem;
            font-weight: 800;
            font-family: 'Space Grotesk';
            margin-bottom: 0.25rem;
            display: flex;
            align-items: baseline;
            gap: 0.25rem;
        }

        .stat-value-large span {
            font-size: 1rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .stat-sub {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            margin-top: 2rem;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .xp-display {
            color: var(--accent-purple);
            font-weight: 700;
            font-family: 'Space Grotesk';
        }

        .filter-pills {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            scrollbar-width: none;
        }

        .filter-pills::-webkit-scrollbar {
            display: none;
        }

        .pill {
            padding: 0.5rem 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            color: var(--text-secondary);
        }

        .pill.active {
            background: var(--accent-purple);
            border-color: var(--accent-purple);
            color: white;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .task-item {
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .task-item:hover {
            border-color: var(--accent-purple);
            transform: translateX(4px);
        }

        .task-item.completed {
            opacity: 0.6;
            border-color: rgba(34, 197, 94, 0.2);
        }

        .task-item.completed .task-title {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid var(--text-muted);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .task-item.completed .checkbox {
            background: var(--accent-green);
            border-color: var(--accent-green);
            color: white;
        }

        .task-content {
            flex: 1;
        }

        .task-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 0.25rem;
        }

        .task-meta {
            display: flex;
            gap: 0.75rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .tag {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .priority {
            text-transform: uppercase;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
        }

        .priority.critical {
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
        }

        .priority.high {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-orange);
        }

        .priority.medium {
            background: rgba(6, 182, 212, 0.15);
            color: var(--accent-cyan);
        }

        .task-xp {
            font-weight: 700;
            color: var(--accent-purple);
            font-size: 0.9rem;
            font-family: 'Space Grotesk';
        }

        .task-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .task-play-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(99, 102, 241, 0.1);
            color: var(--accent-purple);
            border: 1px solid rgba(99, 102, 241, 0.2);
            cursor: pointer;
            transition: all 0.2s;
        }

        .task-play-btn:hover {
            background: var(--accent-purple);
            color: white;
            transform: scale(1.05);
        }

        .progress-track {
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill-sub {
            height: 100%;
            background: var(--accent-green);
            border-radius: 2px;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(5, 5, 7, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            padding: 0.75rem 1rem calc(0.75rem + env(safe-area-inset-bottom));
            z-index: 100;
        }

        .nav-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-around;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            padding: 0.5rem 1rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 600;
            border-radius: 12px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .nav-item.active,
        .nav-item:hover {
            color: var(--accent-purple);
            background: rgba(99, 102, 241, 0.1);
        }

        .nav-item i {
            font-size: 1.4rem;
        }

        .focus-modal {
            position: fixed;
            inset: 0;
            background: rgba(5, 5, 7, 0.98);
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .focus-modal.active {
            display: flex;
        }

        .focus-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .focus-subtitle {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            text-align: center;
        }

        .focus-timer-display {
            font-family: 'Space Grotesk';
            font-size: 6rem;
            font-weight: 700;
            margin: 2rem 0;
            letter-spacing: -2px;
        }

        .focus-controls {
            display: flex;
            gap: 1rem;
        }

        .focus-btn {
            padding: 1rem 2.5rem;
            border-radius: 100px;
            font-size: 1.1rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .focus-btn.start {
            background: var(--accent-purple);
            color: white;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }

        .focus-btn.start:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(99, 102, 241, 0.5);
        }

        .focus-btn.stop {
            background: var(--accent-red);
            color: white;
        }

        .close-focus {
            position: absolute;
            top: 2rem;
            right: 2rem;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 2000;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            pointer-events: none;
            z-index: 9999;
        }

        .phase-indicator {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 0.5rem 1rem;
            margin-bottom: 1rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .phase-indicator .phase-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .phase-foundation {
            background: #3b82f6;
        }

        .phase-revision {
            background: #f59e0b;
        }

        .phase-test {
            background: #ef4444;
        }
    </style>
</head>

<body>
    <div class="bg-mesh"></div>

    <header class="app-header">
        <div class="header-content">
            <div class="brand">
                <div class="brand-icon"><i class="ph ph-atom"></i></div>
                <div class="brand-text">
                    <h1>Dynamic IAT Planner</h1>
                    <span>90-Day Sprint</span>
                </div>
            </div>
            <div class="header-actions">
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <div
                        style="font-weight: 700; color: var(--accent-orange); display: flex; align-items: center; gap: 0.25rem;">
                        <i class="ph ph-fire"></i> <span id="headerStreak">0</span>
                    </div>
                    <div
                        style="font-weight: 700; color: var(--accent-purple); display: flex; align-items: center; gap: 0.25rem;">
                        <i class="ph ph-lightning"></i> <span id="headerXP">0 XP</span>
                    </div>
                </div>
                <button class="icon-btn" onclick="resetData()"><i class="ph ph-arrow-counter-clockwise"></i></button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="date-strip-container">
            <div class="date-strip-card" id="dateStripContainer"></div>
        </div>

        <div class="phase-indicator" id="phaseIndicator">
            <div class="phase-dot phase-foundation"></div>
            <span id="phaseText">Foundation Phase (Days 1-30)</span>
        </div>

        <div class="stats-overview" style="margin-bottom: 2rem;">
            <div class="stat-card primary">
                <div class="stat-label"><i class="ph ph-clock"></i> Today's Focus</div>
                <div class="stat-value-large" id="totalFocusTime">0<span>h</span> 00<span>m</span></div>
                <div class="stat-sub" id="focusSub">Ready to track</div>
            </div>
            <div class="stat-card">
                <div class="stat-label"><i class="ph ph-target"></i> Tasks Completed</div>
                <div class="stat-value-large" id="tasksCompletedCount">0/4</div>
                <div class="progress-track" style="margin-top: 0.5rem;">
                    <div class="progress-fill-sub" id="tasksProgressBar" style="width: 0%;"></div>
                </div>
            </div>
        </div>

        <div class="section-header">
            <div class="section-title" id="planTitle">Today's Plan</div>
            <div class="xp-display" id="xpDisplay">+0 XP Today</div>
        </div>

        <div class="filter-pills">
            <div class="pill active" onclick="filterTasks('all', this)">All</div>
            <div class="pill" onclick="filterTasks('physics', this)">Physics</div>
            <div class="pill" onclick="filterTasks('chemistry', this)">Chemistry</div>
            <div class="pill" onclick="filterTasks('mathematics', this)">Math</div>
            <div class="pill" onclick="filterTasks('biology', this)">Biology</div>
        </div>

        <div class="task-list" id="taskList"></div>
    </main>

    <nav class="bottom-nav">
        <div class="nav-container">
            <a class="nav-item active" onclick="switchTab('home')"><i class="ph ph-house"></i><span>Today</span></a>
            <a class="nav-item" onclick="switchTab('plan')"><i class="ph ph-calendar"></i><span>Plan</span></a>
            <a class="nav-item" onclick="switchTab('mock')"><i class="ph ph-exam"></i><span>Mock</span></a>
            <a class="nav-item" onclick="switchTab('profile')"><i class="ph ph-user"></i><span>Profile</span></a>
        </div>
    </nav>

    <div class="focus-modal" id="focusModal">
        <button class="close-focus" onclick="closeFocus()"><i class="ph ph-x"></i></button>
        <div class="focus-title" id="focusGreeting">Focus Session</div>
        <div class="focus-subtitle" id="focusDetails">Ready to make progress?</div>
        <div id="focusIcon" style="font-size: 4rem; margin-bottom: 1rem;"><i class="ph ph-target"></i></div>
        <div id="focusTopic" style="font-size: 1.5rem; font-weight: 700; margin-bottom: 2rem; text-align: center;">-
        </div>
        <div class="focus-timer-display" id="focusTimer">00:00</div>
        <div class="focus-controls">
            <button class="focus-btn start" id="startBtn" onclick="toggleFocusTimer()">
                <i class="ph ph-play"></i> Start Session
            </button>
            <button class="focus-btn stop" id="stopBtn" onclick="completeFocus()" style="display: none;">
                <i class="ph ph-check-circle"></i> Complete Early
            </button>
        </div>
    </div>

    <div class="toast" id="toast">
        <i class="ph ph-trophy" style="font-size: 1.5rem; color: var(--accent-orange);"></i>
        <div>
            <div style="font-weight: 700;">Session Complete!</div>
            <div style="font-size: 0.85rem; color: var(--text-muted);" id="toastMsg">Time tracked and saved</div>
        </div>
    </div>

    <script>
        // STRICT 90-DAY PLAN BASED ON USER REQUIREMENTS
        const PLAN_90_DAYS = [
            // DAYS 1-30: FOUNDATION PHASE
            // Day 1
            [
                { subject: 'biology', topicName: 'Diversity in the Living World (taxonomy basics)', priority: 'medium', class: 11, allocatedTime: 120, xp: 100 },
                { subject: 'chemistry', topicName: 'Some Basic Concepts (mole concept)', priority: 'high', class: 11, allocatedTime: 120, xp: 150 },
                { subject: 'mathematics', topicName: 'Sets & Logic', priority: 'medium', class: 11, allocatedTime: 120, xp: 100 },
                { subject: 'physics', topicName: 'Units & Measurements', priority: 'medium', class: 11, allocatedTime: 120, xp: 100 },
            ],
            // Day 2
            [
                { subject: 'biology', topicName: 'Biological classification', priority: 'high', class: 11, allocatedTime: 120, xp: 150 },
                { subject: 'chemistry', topicName: 'Mole concept numericals', priority: 'critical', class: 11, allocatedTime: 120, xp: 200 },
                { subject: 'mathematics', topicName: 'Relations & functions', priority: 'high', class: 11, allocatedTime: 120, xp: 150 },
                { subject: 'physics', topicName: 'Motion in a Straight Line', priority: 'high', class: 11, allocatedTime: 120, xp: 150 },
            ],
            // Day 3
            [
                { subject: 'biology', topicName: 'Plant Kingdom', priority: 'high', class: 11, allocatedTime: 120, xp: 150 },
                { subject: 'chemistry', topicName: 'Structure of the Atom (Bohr + quantum nos.)', priority: 'critical', class: 11, allocatedTime: 120, xp: 200 },
                { subject: 'mathematics', topicName: 'Basic counting techniques', priority: 'medium', class: 11, allocatedTime: 120, xp: 100 },
                { subject: 'physics', topicName: 'Motion in a Plane', priority: 'high', class: 11, allocatedTime: 120, xp: 150 },
            ],
            // Day 4
            [
                { subject: 'biology', topicName: 'Animal Kingdom', priority: 'high', class: 11, allocatedTime: 120, xp: 150 },
                { subject: 'chemistry', topicName: 'Structure of Atom (electronic config)', priority: 'critical', class: 11, allocatedTime: 120, xp: 200 },
                { subject: 'mathematics', topicName: 'Complex numbers', priority: 'high', class: 11, allocatedTime: 120, xp: 150 },
                { subject: 'physics', topicName: 'Laws of Motion', priority: 'critical', class: 11, allocatedTime: 120, xp: 200 },
            ],
            // Day 5
            [
                { subject: 'biology', topicName: 'Structural Organisation in Plants', priority: 'medium', class: 11, allocatedTime: 120, xp: 100 },
                { subject: 'chemistry', topicName: 'Periodicity in properties', priority: 'high', class: 11, allocatedTime: 120, xp: 150 },
                { subject: 'mathematics', topicName: 'Quadratic equations', priority: 'high', class: 11, allocatedTime: 120, xp: 150 },
                { subject: 'physics', topicName: 'Work, Energy & Power', priority: 'critical', class: 11, allocatedTime: 120, xp: 200 },
            ],
            // Day 6
            [

        let appState = {

        // Initialization
        function init() {
            const saved = localStorage.getItem('IAT2026_90_DAY_PLANNER');
            if (saved) {
                appState = JSON.parse(saved);
                updateStreak();
                renderAll();
            } else {
                welcomeSetup();
            }
        }

        function welcomeSetup() {
            document.body.innerHTML += `
                <div class="focus-modal active" id="welcomeModal" style="z-index: 3000; display:flex; flex-direction:column; align-items:center; justify-content:center;">
                    <div style="text-align: center; max-width: 400px; background: var(--bg-card); padding: 2rem; border-radius: 1rem; border: 1px solid var(--glass-border);">

                        <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Welcome to Dynamic IAT Planner</h2>
                        <p style="color: var(--text-muted); margin-bottom: 2rem;">Your strict 90-day blueprint. No excuses.</p>
                        <input type="text" id="setupName" placeholder="Your Name" style="width: 100%; padding: 1rem; background: var(--bg-secondary); border: 1px solid var(--glass-border); border-radius: 12px; color: white; margin-bottom: 1rem; font-size: 1rem;">
                        <button onclick="completeSetup()" style="width: 100%; padding: 1rem; background: var(--accent-purple); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer;">Begin Day 1</button>
                    </div>
                </div>
            `;

        function completeSetup() {
            appState.user.name = document.getElementById('setupName').value || 'Aspirant';
            appState.user.startDate = new Date().toISOString();
            appState.stats.lastActiveDate = new Date().toDateString();
            appState.currentDay = 1;

            saveData();
            document.getElementById('welcomeModal').remove();
            renderAll();
        }

        function saveData() {
            localStorage.setItem('IAT2026_90_DAY_PLANNER', JSON.stringify(appState));
        }

        function resetData() {
            if (confirm('Delete all progress and restart from Day 1?')) {
                localStorage.removeItem('IAT2026_90_DAY_PLANNER');
                location.reload();
            }
        }

        function updateStreak() {
            const today = new Date().toDateString();
            const lastActive = appState.stats.lastActiveDate;

            if (!lastActive) {
                appState.stats.streak = 0;
            } else {
                const lastDate = new Date(lastActive);
                const todayDate = new Date(today);
                const diffDays = Math.floor((todayDate - lastDate) / (1000 * 60 * 60 * 24));

                if (diffDays > 1) {
                    appState.stats.streak = 0;
                }
            }
        }

        function getPhaseInfo(day) {
            if (day <= 30) return { name: 'Foundation Phase', class: 'phase-foundation', text: 'Days 1-30: Building Core Concepts' };
            if (day <= 60) return { name: 'Revision Phase', class: 'phase-revision', text: 'Days 31-60: Strengthening & Revision' };
            if (day <= 75) return { name: '2nd Revision', class: 'phase-revision', text: 'Days 61-75: Fast Track Revision' };
            return { name: 'Test Mode', class: 'phase-test', text: 'Days 76-90: Final Test Mode' };
        }

        function renderDateStrip() {
            const container = document.getElementById('dateStripContainer');
            if (!container) return;
            container.innerHTML = '';

            const today = new Date();
            const start = appState.user.startDate ? new Date(appState.user.startDate) : new Date();
            start.setHours(0, 0, 0, 0);
            const todayStart = new Date();
            todayStart.setHours(0, 0, 0, 0);
            const todayDayNum = Math.floor((todayStart - start) / (1000 * 60 * 60 * 24)) + 1;

            for (let i = -3; i <= 3; i++) {
                const d = new Date(today);
                d.setDate(today.getDate() + i);
                const targetDayNum = todayDayNum + i;
                const isActive = (targetDayNum === appState.currentDay);

                const el = document.createElement('div');
                el.className = `date-item ${isActive ? 'active' : ''}`;
                const offsetFromCurrent = targetDayNum - appState.currentDay;

                el.onclick = () => {
                    let newDay = appState.currentDay + offsetFromCurrent;
                    newDay = Math.max(1, Math.min(90, newDay));
                    if (appState.currentDay !== newDay) {
                        appState.currentDay = newDay;
                        saveData();
                        renderAll();
                    }
                };

                el.innerHTML = `
                    <span class="date-day">${d.toLocaleDateString('en-US', { weekday: 'short' })}</span>
                    <span class="date-num">${d.getDate()}</span>
                    <span class="date-month">${d.toLocaleDateString('en-US', { month: 'short' })}</span>
                `;
                container.appendChild(el);
            }

            const titleEl = document.getElementById('planTitle');
            if (titleEl) {
                if (appState.currentDay === todayDayNum) titleEl.innerText = "Today's Plan";
                else titleEl.innerText = `Plan for Day ${appState.currentDay}`;
            }

            // Update phase indicator
            const phaseInfo = getPhaseInfo(appState.currentDay);
            const phaseIndicator = document.getElementById('phaseIndicator');
            const phaseText = document.getElementById('phaseText');
            if (phaseIndicator && phaseText) {
                phaseIndicator.querySelector('.phase-dot').className = `phase-dot ${phaseInfo.class}`;
                phaseText.textContent = phaseInfo.text;
            }
        }

        function incrementStreak() {
            const today = new Date().toDateString();
            if (appState.stats.lastActiveDate !== today) {
                appState.stats.streak++;
                appState.stats.lastActiveDate = today;
                if (appState.stats.streak > appState.stats.longestStreak) {
                    appState.stats.longestStreak = appState.stats.streak;
                }
            }
        }

        function renderAll() {
            renderHeader();
            renderStats();
            renderDateStrip();
            renderTasks();
        }

        function renderHeader() {
            document.getElementById('headerStreak').textContent = appState.stats.streak;
            document.getElementById('headerXP').textContent = appState.stats.totalXP + " XP";
        }

        function renderStats() {
            const h = Math.floor(appState.stats.totalFocusMinutes / 60);
            const m = appState.stats.totalFocusMinutes % 60;
            document.getElementById('totalFocusTime').innerHTML = `${h}<span>h</span> ${m.toString().padStart(2, '0')}<span>m</span>`;

            const dayKey = `Day ${appState.currentDay}`;
            if (!appState.dailyStatus[dayKey]) {
                appState.dailyStatus[dayKey] = {};
            }

            const todayTasks = PLAN_90_DAYS[appState.currentDay - 1] || [];
            let compTasks = 0;
            todayTasks.forEach((t, index) => {
                if (appState.dailyStatus[dayKey][index]) compTasks++;
            });

            document.getElementById('tasksCompletedCount').textContent = `${compTasks}/${todayTasks.length}`;
            const pct = todayTasks.length > 0 ? (compTasks / todayTasks.length) * 100 : 0;
            document.getElementById('tasksProgressBar').style.width = `${pct}%`;
        }

        function filterTasks(filter, el) {
            currentFilter = filter;
            document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            renderTasks();
        }

        function renderTasks() {
            const container = document.getElementById('taskList');
            container.innerHTML = '';

            let rawTasks = PLAN_90_DAYS[appState.currentDay - 1] || [];
            let tasks = [...rawTasks];

            const dayKey = `Day ${appState.currentDay}`;

            if (currentFilter !== 'all') {
                tasks = tasks.filter(t => t.subject === currentFilter);
            }

            let todayXP = 0;

            tasks.forEach((task) => {
                const originalIndex = rawTasks.indexOf(task);
                const isCompleted = appState.dailyStatus[dayKey]?.[originalIndex] === true;

                if (isCompleted) todayXP += Math.floor(task.xp);

                let el = document.createElement('div');
                el.className = `task-item ${isCompleted ? 'completed' : ''}`;

                const subj = task.isTest ? { icon: 'exam', name: 'Test', color: '#6366f1' } : SYLLABUS_META[task.subject];

                el.innerHTML = `
                    <div class="checkbox" onclick="toggleTask(${originalIndex})">${isCompleted ? '<i class="ph ph-check"></i>' : ''}</div>
                    <div class="task-content">
                        <div class="task-title" onclick="toggleTask(${originalIndex})" style="cursor: pointer;">${task.topicName}</div>
                        <div class="task-meta">
                            <span class="priority ${task.priority}">${task.priority}</span>
                            <span class="tag"><i class="ph ph-${subj.icon}"></i> ${subj.name}</span>
                            <span class="tag"><i class="ph ph-clock"></i> ${task.allocatedTime}m</span>
                        </div>
                    </div>
                `;

                if (!isCompleted && task.allocatedTime > 0) {
                    const actions = document.createElement('div');
                    actions.className = 'task-actions';
                    actions.innerHTML = `
                        <button class="task-play-btn" onclick="openFocusModeForTask(${originalIndex})" title="Start Session"><i class="ph ph-play-circle" style="font-size:1.5rem"></i></button>
                    `;
                    el.appendChild(actions);
                } else if (isCompleted) {
                    const xpEl = document.createElement('div');
                    xpEl.className = 'task-xp';
                    xpEl.textContent = `+${Math.floor(task.xp)} XP`;
                    el.appendChild(xpEl);
                }

                container.appendChild(el);
            });

            document.getElementById('xpDisplay').textContent = `+${todayXP} XP Earned`;
        }

        function toggleTask(originalIndex) {
            const dayKey = `Day ${appState.currentDay}`;
            const task = PLAN_90_DAYS[appState.currentDay - 1][originalIndex];

            if (!appState.dailyStatus[dayKey]) {
                appState.dailyStatus[dayKey] = {};
            }

            const wasCompleted = appState.dailyStatus[dayKey][originalIndex] === true;
            appState.dailyStatus[dayKey][originalIndex] = !wasCompleted;

            if (!wasCompleted) {
                appState.stats.totalXP += Math.floor(task.xp);
                showToast('Task Done!', `+${Math.floor(task.xp)} XP`);
                createConfetti();
                incrementStreak();
            } else {
                appState.stats.totalXP -= Math.floor(task.xp);
            }

            saveData();
            renderAll();
        }

        function openFocusModeForTask(originalIndex) {
            const dayKey = `Day ${appState.currentDay}`;
            const task = PLAN_90_DAYS[appState.currentDay - 1][originalIndex];
            if (!task || appState.dailyStatus[dayKey]?.[originalIndex]) return;

            currentTaskId = originalIndex;
            focusTotalTime = task.allocatedTime * 60;
            focusTimeRemaining = focusTotalTime;

            const subj = task.isTest ? { icon: 'exam', name: 'Test', color: '#6366f1' } : SYLLABUS_META[task.subject];
            document.getElementById('focusIcon').innerHTML = `<i class="ph ph-${subj.icon}" style="color:${subj.color}"></i>`;
            document.getElementById('focusTopic').textContent = task.topicName;
            document.getElementById('focusDetails').textContent = `Class ${task.class} • ${task.allocatedTime} mins • ${task.priority.toUpperCase()} priority`;

            updateFocusTimerDisplay();

            document.getElementById('focusModal').classList.add('active');
            document.getElementById('startBtn').style.display = 'flex';
            document.getElementById('stopBtn').style.display = 'none';
        }

        function toggleFocusTimer() {
            if (focusTimerInterval) return;
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'flex';

            focusTimerInterval = setInterval(() => {
                focusTimeRemaining--;
                updateFocusTimerDisplay();

                if (focusTimeRemaining <= 0) {
                    completeFocus();
                }
            }, 1000);
        }

        function updateFocusTimerDisplay() {
            const m = Math.floor(focusTimeRemaining / 60).toString().padStart(2, '0');
            const s = (focusTimeRemaining % 60).toString().padStart(2, '0');
            document.getElementById('focusTimer').textContent = `${m}:${s}`;
        }

        function completeFocus() {
            if (focusTimerInterval) {
                clearInterval(focusTimerInterval);
                focusTimerInterval = null;
            }

            if (currentTaskId !== null) {
                const dayKey = `Day ${appState.currentDay}`;
                if (!appState.dailyStatus[dayKey]?.[currentTaskId]) {
                    const timeSpent = Math.ceil((focusTotalTime - focusTimeRemaining) / 60);
                    appState.stats.totalFocusMinutes += timeSpent;
                    appState.stats.sessionsCompleted++;
                    toggleTask(currentTaskId);
                }
            }

            closeFocus();
        }

        function closeFocus() {
            if (focusTimerInterval) {
                clearInterval(focusTimerInterval);
                focusTimerInterval = null;
            }
            currentTaskId = null;
            document.getElementById('focusModal').classList.remove('active');
            renderAll();
        }

        function showToast(title, msg) {
            document.querySelector('#toast div:first-child').textContent = title;
            document.getElementById('toastMsg').textContent = msg;
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function createConfetti() {
            const colors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6'];
            for (let i = 0; i < 50; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.background = colors[Math.floor(Math.random() * colors.length)];
                document.body.appendChild(c);

                const anim = c.animate([
                    { transform: `translate3d(0, 0, 0) rotate(0)`, opacity: 1 },
                    { transform: `translate3d(${Math.random() * 100 - 50}px, 100vh, 0) rotate(${Math.random() * 720}deg)`, opacity: 0 }
                ], { duration: 1000 + Math.random() * 1000, easing: 'cubic-bezier(.37,0,.63,1)' });

                anim.onfinish = () => c.remove();
            }
        }

        function switchTab(tab) {
            // Simple tab switching - can be expanded
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        // Boot
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
