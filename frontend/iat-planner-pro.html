<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IISER IAT 2026 Sprint | Real Performance Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;600;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg-primary: #050507;
            --bg-secondary: #0a0a0f;
            --bg-card: rgba(15, 15, 25, 0.7);
            --accent-purple: #6366f1;
            --accent-pink: #ec4899;
            --accent-cyan: #06b6d4;
            --accent-green: #22c55e;
            --accent-orange: #f59e0b;
            --accent-red: #ef4444;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --glass-border: rgba(255, 255, 255, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 100px;
            line-height: 1.6;
        }

        .bg-mesh {
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.12), transparent 40%),
                radial-gradient(circle at 80% 20%, rgba(236, 72, 153, 0.08), transparent 40%);
            pointer-events: none;
        }

        .app-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(5, 5, 7, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: 1rem;
        }

        .header-content {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        .brand-text h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .brand-text span {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .header-actions {
            display: flex;
            gap: 0.5rem;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: var(--bg-secondary);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.25rem;
        }

        .icon-btn:hover {
            background: var(--glass-border);
            transform: translateY(-2px);
        }

        .icon-btn.recording {
            animation: pulse-rec 1.5s infinite;
            background: rgba(239, 68, 68, 0.2);
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        @keyframes pulse-rec {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
            }

            50% {
                box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);
            }
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 1.5rem 1rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 1.5rem 1rem;
        }

        /* Date Strip Card */
        .date-strip-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            overflow-x: auto;
            gap: 1.5rem;
            scrollbar-width: none;
        }

        .date-strip-card::-webkit-scrollbar {
            display: none;
        }

        .date-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 60px;
            cursor: pointer;
            padding: 0.75rem 0.5rem;
            border-radius: 12px;
            transition: all 0.2s;
            position: relative;
        }

        .date-item .date-day {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .date-item .date-num {
            font-size: 1.5rem;
            font-weight: 800;
            font-family: 'Space Grotesk', sans-serif;
            color: var(--text-primary);
            line-height: 1;
            margin-bottom: 0.25rem;
        }

        .date-item .date-month {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .date-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .date-item.active {
            background: var(--accent-purple);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
            cursor: default;
        }

        .date-item.active .date-day,
        .date-item.active .date-num,
        .date-item.active .date-month {
            color: white;
        }

        .date-item.active::after {
            content: '';
            position: absolute;
            bottom: 4px;
            width: 4px;
            height: 4px;
            background: var(--accent-orange);
            border-radius: 50%;
            box-shadow: 0 0 5px var(--accent-orange);
        }

        /* Top Stats - REAL DATA */
        .stats-overview {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        @media (min-width: 640px) {
            .stats-overview {
                grid-template-columns: 2fr 1fr 1fr;
            }
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.25rem;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .stat-card.primary {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(99, 102, 241, 0.05));
            border-color: rgba(99, 102, 241, 0.2);
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stat-value-large {
            font-size: 2.2rem;
            font-weight: 800;
            font-family: 'Space Grotesk', sans-serif;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: baseline;
            gap: 0.25rem;
        }

        .stat-value-large span {
            font-size: 1rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .stat-sub {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Dashboard Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        @media (min-width: 768px) {
            .dashboard-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .dash-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.25rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }

        .dash-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .dash-card-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Subject Split - Real Data */
        .donut-chart-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .donut-chart {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            position: relative;
            flex-shrink: 0;
            transition: all 0.5s ease;
        }

        .donut-hole {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 65px;
            height: 65px;
            background: var(--bg-card);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .donut-hole .hours {
            font-size: 1.1rem;
            color: var(--text-primary);
            font-weight: 700;
        }

        .subject-legend {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex: 1;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
        }

        .legend-item .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .legend-item .name {
            color: var(--text-secondary);
            flex: 1;
        }

        .legend-item .time {
            color: var(--text-primary);
            font-weight: 600;
            font-family: 'Space Grotesk';
        }

        /* Consistency - Real Streak Data */
        .consistency-display {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
        }

        .consistency-percent {
            font-size: 2.8rem;
            font-weight: 800;
            font-family: 'Space Grotesk';
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 0.75rem;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--accent-green);
            width: 0%;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px var(--accent-green);
        }

        .consistency-meta {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Study Balance - Real Analysis */
        .study-balance-content {
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
        }

        .balance-score {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin: 0 auto 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            position: relative;
        }

        .balance-score::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }

        .balance-text {
            font-weight: 700;
            margin-bottom: 0.25rem;
            font-size: 1.1rem;
        }

        .balance-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* Activity Map - Real Sessions */
        .activity-map-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .activity-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .activity-title {
            font-size: 0.9rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .activity-legend {
            display: flex;
            gap: 0.75rem;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .legend-item-small {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 2px;
        }

        .timeline {
            display: flex;
            justify-content: space-between;
            position: relative;
            padding: 1.5rem 0 0.5rem;
            gap: 0.5rem;
        }

        .time-segment {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .time-bar-container {
            width: 100%;
            height: 80px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
        }

        .time-fill {
            width: 100%;
            border-radius: 8px 8px 0 0;
            transition: height 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            min-height: 4px;
        }

        .time-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100%;
            background: linear-gradient(to top, transparent, rgba(255, 255, 255, 0.1));
        }

        .time-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-top: 0.25rem;
        }

        .time-value {
            font-size: 0.75rem;
            color: var(--text-primary);
            font-weight: 600;
            font-family: 'Space Grotesk';
        }

        /* Tasks Section */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            margin-top: 2rem;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .xp-display {
            color: var(--accent-purple);
            font-weight: 700;
            font-family: 'Space Grotesk';
        }

        .filter-pills {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            scrollbar-width: none;
        }

        .filter-pills::-webkit-scrollbar {
            display: none;
        }

        .pill {
            padding: 0.5rem 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            color: var(--text-secondary);
        }

        .pill.active {
            background: var(--accent-purple);
            border-color: var(--accent-purple);
            color: white;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .task-item {
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .task-item:hover {
            border-color: var(--accent-purple);
            transform: translateX(4px);
        }

        .task-item.completed {
            opacity: 0.6;
            border-color: rgba(34, 197, 94, 0.2);
        }

        .task-item.completed .task-title {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid var(--text-muted);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .task-item.completed .checkbox {
            background: var(--accent-green);
            border-color: var(--accent-green);
            color: white;
        }

        .task-content {
            flex: 1;
        }

        .task-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 0.25rem;
        }

        .task-meta {
            display: flex;
            gap: 0.75rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .tag {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .priority {
            text-transform: uppercase;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
        }

        .priority.critical {
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
        }

        .priority.high {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-orange);
        }

        .priority.medium {
            background: rgba(6, 182, 212, 0.15);
            color: var(--accent-cyan);
        }

        .task-xp {
            font-weight: 700;
            color: var(--accent-purple);
            font-size: 0.9rem;
            font-family: 'Space Grotesk';
        }

        /* Live Session Indicator */
        .live-session-bar {
            background: linear-gradient(90deg, rgba(99, 102, 241, 0.1), rgba(236, 72, 153, 0.1));
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
            display: none;
            align-items: center;
            gap: 1rem;
        }

        .live-session-bar.active {
            display: flex;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .live-indicator {
            width: 12px;
            height: 12px;
            background: var(--accent-red);
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        .live-info {
            flex: 1;
        }

        .live-title {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .live-time {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: 'Space Grotesk';
        }

        .live-btn {
            padding: 0.5rem 1rem;
            background: var(--accent-red);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.8rem;
        }

        /* Subject Grid */
        .subject-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-top: 1.5rem;
        }

        @media (min-width: 640px) {
            .subject-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .subject-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.25rem;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
        }

        .subject-card:hover {
            transform: translateY(-4px);
            border-color: var(--subject-color);
        }

        .subject-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--subject-color);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .subject-card:hover::before {
            opacity: 1;
        }

        .subject-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            margin-bottom: 0.75rem;
            color: var(--subject-color);
        }

        .subject-name {
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
        }

        .subject-time {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--subject-color);
            font-family: 'Space Grotesk';
            margin-bottom: 0.25rem;
        }

        .subject-stats {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
        }

        .progress-track {
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill-sub {
            height: 100%;
            background: var(--subject-color);
            border-radius: 2px;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(5, 5, 7, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            padding: 0.75rem 1rem calc(0.75rem + env(safe-area-inset-bottom));
            z-index: 100;
        }

        .nav-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-around;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            padding: 0.5rem 1rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 600;
            border-radius: 12px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .nav-item.active,
        .nav-item:hover {
            color: var(--accent-purple);
            background: rgba(99, 102, 241, 0.1);
        }

        .nav-item i {
            font-size: 1.4rem;
        }

        /* Focus Modal */
        .focus-modal {

            localStorage.setItem('IAT2026_90_DAY_PLANNER', JSON.stringify(appState));

            if (confirm('Delete all progress and restart from Day 1?')) {
                localStorage.removeItem('IAT2026_90_DAY_PLANNER');
                location.reload();
            }
        }

        // Streak
        function updateStreak() {
            const today = new Date().toDateString();
            const lastActive = appState.stats.lastActiveDate;

            if (!lastActive) {
                appState.stats.streak = 0;
            } else {
                const lastDate = new Date(lastActive);
                const todayDate = new Date(today);
                const diffDays = Math.floor((todayDate - lastDate) / (1000 * 60 * 60 * 24));

                if (diffDays > 1) {
                    appState.stats.streak = 0;
                }
            }
        }

        function renderDateStrip() {
            const container = document.getElementById('dateStripContainer');
            if (!container) return;
            container.innerHTML = '';

            const today = new Date();

            // Calculate what day number today is relative to start
            const start = appState.user.startDate ? new Date(appState.user.startDate) : new Date();
            start.setHours(0, 0, 0, 0);
            const todayStart = new Date();
            todayStart.setHours(0, 0, 0, 0);
            const todayDayNum = Math.floor((todayStart - start) / (1000 * 60 * 60 * 24)) + 1;

            // Render previous days and future days around "today"
            for (let i = -3; i <= 3; i++) {
                const d = new Date(today);
                d.setDate(today.getDate() + i);

                // Calculate the target day number for this specific rendered item
                const targetDayNum = todayDayNum + i;

                // Active logic: Visual highlight if this item represents the CURRENT selected day in the 90-day plan
                const isActive = (targetDayNum === appState.currentDay);

                const el = document.createElement('div');
                el.className = `date-item ${isActive ? 'active' : ''}`;

                // Allow them to skip to other days by clicking the strip
                // We know that `appState.currentDay` + (targetDayNum - appState.currentDay) = targetDayNum
                const offsetFromCurrent = targetDayNum - appState.currentDay;

                el.onclick = () => {
                    let newDay = appState.currentDay + offsetFromCurrent;
                    // Constrain
                    newDay = Math.max(1, Math.min(90, newDay));
                    if (appState.currentDay !== newDay) {
                        appState.currentDay = newDay;
                        saveData();
                        renderAll();
                    }
                };

                el.innerHTML = `
                    <span class="date-day">${d.toLocaleDateString('en-US', { weekday: 'short' })}</span>
                    <span class="date-num">${d.getDate()}</span>
                    <span class="date-month">${d.toLocaleDateString('en-US', { month: 'short' })}</span>
                `;
                container.appendChild(el);
            }

            // Re-label Smart Daily Plan section header
            const titleEl = document.querySelector('.section-title');
            if (titleEl) {
                if (appState.currentDay === todayDayNum) titleEl.innerText = "Today's Plan";
                else titleEl.innerText = `Plan for Day ${appState.currentDay}`;
            }
        }

        function incrementStreak() {
            const today = new Date().toDateString();
            if (appState.stats.lastActiveDate !== today) {
                appState.stats.streak++;
                appState.stats.lastActiveDate = today;
                if (appState.stats.streak > appState.stats.longestStreak) {
                    appState.stats.longestStreak = appState.stats.streak;
                }
            }
        }

            if (appState.currentDay > 1) {
                appState.currentDay--;

                renderAll();

                appState.currentDay++;

            const dayKey = `Day ${appState.currentDay}`;
            if (!appState.dailyStatus[dayKey]) {
                appState.dailyStatus[dayKey] = {};

            const todayTasks = PLAN_90_DAYS[appState.currentDay - 1];
            let compTasks = 0;
            todayTasks.forEach((t, index) => {

            document.getElementById('tasksCompletedCount').textContent = `${compTasks}/${todayTasks.length}`;

            document.getElementById('tasksProgressBar').style.width = `${pct}%`;
        }

        function renderDateStrip() {
            const container = document.getElementById('dateStripContainer');
            if (!container) return;
            container.innerHTML = `

                    <button class="icon-btn" onclick="nextDay()" style="color: var(--accent-purple); border: 1px solid var(--glass-border); background: var(--bg-secondary); padding: 0.5rem; border-radius: 8px;">Next <i class="ph ph-caret-right"></i></button>

        function filterTasks(filter, el) {
            currentFilter = filter;
            document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            renderTasks();
        }

        function renderTasks() {
            const container = document.getElementById('taskList');
            container.innerHTML = '';

            let rawTasks = PLAN_90_DAYS[appState.currentDay - 1];
            let tasks = Object.assign([], rawTasks);

            const dayKey = `Day ${appState.currentDay}`;

            if (currentFilter !== 'all') {
                tasks = tasks.filter(t => t.subject === currentFilter);
            }

            let todayXP = 0;

            tasks.forEach((task) => {
                // Find original index to maintain status mapping correctly
                const originalIndex = rawTasks.indexOf(task);
                const isCompleted = appState.dailyStatus[dayKey][originalIndex] === true;

                if (isCompleted) todayXP += Math.floor(task.xp);

                let el = document.createElement('div');
                el.className = `task-item ${isCompleted ? 'completed' : ''}`;

                const subj = task.isTest ? { icon: 'exam', name: 'Test', color: '#6366f1' } : SYLLABUS_META[task.subject];

                // Content
                el.innerHTML = `
                    <div class="checkbox" onclick="toggleTask(${originalIndex})">${isCompleted ? '<i class="ph ph-check"></i>' : ''}</div>
                    <div class="task-content">
                        <div class="task-title" onclick="toggleTask(${originalIndex})" style="cursor: pointer;">${task.topicName}</div>

                            <span class="tag"><i class="ph ph-${subj.icon}"></i> ${subj.name}</span>
                            <span class="tag"><i class="ph ph-clock"></i> ${task.allocatedTime}m</span>

                    </div>
                `;

                if (!isCompleted) {
                    const actions = document.createElement('div');
                    actions.className = 'task-actions';
                    actions.innerHTML = `
                        <button class="task-play-btn" onclick="openFocusModeForTask(${originalIndex})" title="Start Session"><i class="ph ph-play-circle" style="font-size:1.5rem"></i></button>

                    el.appendChild(actions);
                } else {
                    const xpEl = document.createElement('div');
                    xpEl.className = 'task-xp';
                    xpEl.textContent = `+${Math.floor(task.xp)} XP`;
                    el.appendChild(xpEl);
                }

                container.appendChild(el);
            });

            document.getElementById('xpDisplay').textContent = `+${todayXP} XP Earned`;
        }

        // Actions
        function toggleTask(originalIndex) {
            const dayKey = `Day ${appState.currentDay}`;
            const task = PLAN_90_DAYS[appState.currentDay - 1][originalIndex];

            const wasCompleted = appState.dailyStatus[dayKey][originalIndex] === true;
            appState.dailyStatus[dayKey][originalIndex] = !wasCompleted;

            if (!wasCompleted) {
                appState.stats.totalXP += Math.floor(task.xp);
                showToast('Task Done!', `+${Math.floor(task.xp)} XP`);
                createConfetti();
                incrementStreak();
            } else {
                appState.stats.totalXP -= Math.floor(task.xp);
            }

            saveData();
            renderAll();

        // Focus Mode
        function openFocusModeForTask(originalIndex) {
            const dayKey = `Day ${appState.currentDay}`;
            const task = PLAN_90_DAYS[appState.currentDay - 1][originalIndex];
            if (!task || appState.dailyStatus[dayKey][originalIndex]) return;

            currentTaskId = originalIndex;
            focusTotalTime = task.allocatedTime * 60;
            focusTimeRemaining = focusTotalTime;

            const subj = task.isTest ? { icon: 'exam', name: 'Test', color: '#6366f1' } : SYLLABUS_META[task.subject];
            document.getElementById('focusIcon').innerHTML = `<i class="ph ph-${subj.icon}" style="color:${subj.color}"></i>`;
            document.getElementById('focusTopic').textContent = task.topicName;
            document.getElementById('focusDetails').textContent = `Class ${task.class} • ${task.allocatedTime} mins • ${task.priority.toUpperCase()} priority`;

            updateFocusTimerDisplay();

            document.getElementById('focusModal').classList.add('active');
            document.getElementById('startBtn').style.display = 'flex';
            document.getElementById('stopBtn').style.display = 'none';

        function toggleFocusTimer() {
            if (focusTimerInterval) return; // already running
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'flex';

            focusTimerInterval = setInterval(() => {
                focusTimeRemaining--;
                updateFocusTimerDisplay();

                if (focusTimeRemaining <= 0) {
                    completeFocus();
                }
            }, 1000);
        }

        function updateFocusTimerDisplay() {
            const m = Math.floor(focusTimeRemaining / 60).toString().padStart(2, '0');
            const s = (focusTimeRemaining % 60).toString().padStart(2, '0');
            document.getElementById('focusTimer').textContent = `${m}:${s}`;
        }

        function completeFocus() {
            if (focusTimerInterval) {
                clearInterval(focusTimerInterval);
                focusTimerInterval = null;
            }

            if (currentTaskId !== null) {
                const dayKey = `Day ${appState.currentDay}`;
                if (!appState.dailyStatus[dayKey][currentTaskId]) {
                    const timeSpent = Math.ceil((focusTotalTime - focusTimeRemaining) / 60);
                    appState.stats.totalFocusMinutes += timeSpent;
                    appState.stats.sessionsCompleted++;
                    toggleTask(currentTaskId);
                }
            }

            closeFocus();
        }

        function closeFocus() {
            if (focusTimerInterval) {
                clearInterval(focusTimerInterval);
                focusTimerInterval = null;
            }
            currentTaskId = null;
            document.getElementById('focusModal').classList.remove('active');
            renderAll();
        }

        function showToast(title, msg) {
            document.querySelector('#toast div:first-child').textContent = title;
            document.getElementById('toastMsg').textContent = msg;
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function createConfetti() {
            const colors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6'];
            for (let i = 0; i < 50; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.background = colors[Math.floor(Math.random() * colors.length)];
                document.body.appendChild(c);

                const anim = c.animate([
                    { transform: `translate3d(0, 0, 0) rotate(0)`, opacity: 1 },
                    { transform: `translate3d(${Math.random() * 100 - 50}px, 100vh, 0) rotate(${Math.random() * 720}deg)`, opacity: 0 }
                ], { duration: 1000 + Math.random() * 1000, easing: 'cubic-bezier(.37,0,.63,1)' });

                anim.onfinish = () => c.remove();
            }
        }

        // Boot
        document.addEventListener('DOMContentLoaded', init);

    </script>
    </script>
</body>
