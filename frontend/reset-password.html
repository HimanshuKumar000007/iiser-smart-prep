<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Reset Password | IISER Edge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .card {
      background: white;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 1rem;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 1rem 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .msg {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.9rem;
    }
  </style>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WHHM4FTNHG"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-WHHM4FTNHG');
  </script>
</head>

<body>

  <div class="card">
    <h2>Reset Password</h2>
    <p style="text-align:center;color:#64748b;">
      Enter your new password
    </p>

    <input type="password" id="newPassword" placeholder="New password" />
    <button onclick="resetPassword()">Reset Password</button>

    <div class="msg" id="msg"></div>
  </div>

  <script src="config.js"></script>
  <script>
    // STEP 1: Read token from URL
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    if (!token) {
      alert("Invalid or missing reset token");
      window.location.href = "forgot-password.html";
    }

    // STEP 2: Handle reset form submit
    async function resetPassword() {
      const newPassword = document.getElementById("newPassword").value;

      if (!newPassword) {
        alert("Please enter new password");
        return;
      }

      const res = await fetch("https://api.iisersmartprep.space/api/reset-password", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          token: token,
          newPassword: newPassword
        })
      });

      const data = await res.json();

      if (data.message) {
        alert("Password updated successfully");
        setTimeout(() => {
          window.location.href = "login.html";
        }, 1500);
      } else {
        alert(data.error || "Reset failed");
      }
    }
  </script>

</body>

</html>
