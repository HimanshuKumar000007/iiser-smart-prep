<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6366f1" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
    <title>IISER Smart Prep | Dashboard</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            /* Premium Color System - Purple to Teal Gradient Theme */
            --primary-50: #eef2ff;
            --primary-100: #e0e7ff;
            --primary-500: #6366f1;
            --primary-600: #4f46e5;
            --primary-700: #4338ca;

            --accent-cyan: #06b6d4;
            --accent-teal: #14b8a6;
            --accent-purple: #8b5cf6;

            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;

            /* Neutral Scale */
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --gray-900: #0f172a;

            /* Semantic Colors */
            --bg: #f8fafc;
            --bg-elevated: #ffffff;
            --bg-sunken: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-tertiary: #64748b;
            --border: rgba(226, 232, 240, 0.6);
            --border-strong: #e2e8f0;

            /* Effects */
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.04);
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.04), 0 2px 4px -2px rgb(0 0 0 / 0.04);
            --shadow-md: 0 10px 15px -3px rgb(0 0 0 / 0.05), 0 4px 6px -4px rgb(0 0 0 / 0.05);
            --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.06), 0 8px 10px -6px rgb(0 0 0 / 0.06);
            --shadow-glow: 0 0 40px -10px rgba(99, 102, 241, 0.4);
            --shadow-glow-sm: 0 0 20px -5px rgba(99, 102, 241, 0.3);

            /* Gradients */
            --gradient-primary: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%);
            --gradient-secondary: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            --gradient-tertiary: linear-gradient(135deg, #06b6d4 0%, #14b8a6 100%);
            --gradient-bg: linear-gradient(180deg, #f8fafc 0%, #ffffff 100%);
            --gradient-card: linear-gradient(180deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.6) 100%);

            /* Spacing (8pt Grid) */
            --space-1: 8px;
            --space-2: 16px;
            --space-3: 24px;
            --space-4: 32px;
            --space-5: 40px;
            --space-6: 48px;

            /* Radius */
            --radius-sm: 12px;
            --radius-md: 16px;
            --radius-lg: 20px;
            --radius-xl: 24px;
            --radius-2xl: 32px;
            --radius-full: 9999px;

            /* Typography */
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-display: 'Outfit', sans-serif;

            /* Animation */
            --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --duration-fast: 150ms;
            --duration-base: 300ms;
            --duration-slow: 500ms;
        }

        [data-theme="dark"] {
            --bg: #020617;
            --bg-elevated: #0f172a;
            --bg-sunken: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-tertiary: #64748b;
            --border: rgba(255, 255, 255, 0.06);
            --border-strong: rgba(255, 255, 255, 0.1);

            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3), 0 2px 4px -2px rgb(0 0 0 / 0.3);
            --shadow-md: 0 10px 15px -3px rgb(0 0 0 / 0.4), 0 4px 6px -4px rgb(0 0 0 / 0.4);
            --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.5), 0 8px 10px -6px rgb(0 0 0 / 0.5);
            --shadow-glow: 0 0 40px -10px rgba(99, 102, 241, 0.5);

            --gradient-bg: linear-gradient(180deg, #020617 0%, #0f172a 100%);
            --gradient-card: linear-gradient(180deg, rgba(15, 23, 41, 0.9) 0%, rgba(15, 23, 41, 0.6) 100%);
        }

        /* Reset & Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text-primary);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            background: var(--gradient-bg);
            padding-bottom: calc(90px + env(safe-area-inset-bottom));
        }

        /* Ambient Background */
        .ambient-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: float 20s ease-in-out infinite;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: var(--primary-500);
            top: -100px;
            right: -100px;
            opacity: 0.3;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: var(--accent-cyan);
            bottom: 10%;
            left: -150px;
            opacity: 0.2;
            animation-delay: -5s;
        }

        [data-theme="dark"] .ambient-orb {
            opacity: 0.15;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(30px, -30px) scale(1.1);
            }

            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }
        }

        /* Layout Container */
        .app-container {
            position: relative;
            z-index: 1;
            max-width: 480px;
            margin: 0 auto;
            padding: var(--space-2);
        }

        /* Header - Sticky & Compact */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(var(--bg), 0.8);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            margin: calc(-1 * var(--space-2));
            margin-bottom: var(--space-2);
            padding: var(--space-2);
            padding-top: calc(var(--space-2) + env(safe-area-inset-top));
            border-bottom: 1px solid var(--border);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-full);
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 18px;
            color: white;
            box-shadow: var(--shadow-glow-sm);
            border: 2px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .avatar::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, transparent 50%);
        }

        .greeting {
            display: flex;
            flex-direction: column;
        }

        .greeting-text {
            font-size: 13px;
            color: var(--text-tertiary);
            font-weight: 500;
        }

        .user-name {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 18px;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .streak-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.1) 0%, rgba(245, 158, 11, 0.05) 100%);
            border: 1px solid rgba(245, 158, 11, 0.2);
            padding: 8px 14px;
            border-radius: var(--radius-full);
            font-weight: 700;
            font-size: 14px;
            color: var(--warning);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        /* Section Headers */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: var(--space-3) 0 var(--space-2);
        }

        .section-title {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 20px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-action {
            font-size: 14px;
            font-weight: 600;
            color: var(--primary-500);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            transition: all var(--duration-fast);
        }

        .section-action:active {
            transform: scale(0.95);
            background: var(--primary-50);
        }

        /* Glass Cards */
        .glass-card {
            background: var(--gradient-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--space-2);
            box-shadow: var(--shadow-md), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: all var(--duration-base) var(--ease-out-expo);
        }

        [data-theme="dark"] .glass-card {
            box-shadow: var(--shadow-md), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .glass-card:active {
            transform: scale(0.98);
            box-shadow: var(--shadow-sm);
        }

        /* Quick Actions Grid */
        .quick-stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--space-1);
            margin-bottom: var(--space-2);
        }

        .stat-card-premium {
            position: relative;
            overflow: hidden;
            padding: var(--space-2);
            border-radius: var(--radius-lg);
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            transition: all var(--duration-base);
        }

        .stat-card-premium::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--card-accent, var(--gradient-primary));
        }

        .stat-card-premium:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .stat-icon-wrap {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 12px;
            background: var(--icon-bg, rgba(99, 102, 241, 0.1));
            color: var(--icon-color, var(--primary-500));
        }

        .stat-label-premium {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-tertiary);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-value-premium {
            font-family: var(--font-display);
            font-size: 28px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            line-height: 1;
            margin-bottom: 8px;
        }

        .stat-trend {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: var(--radius-full);
            background: var(--trend-bg, rgba(16, 185, 129, 0.1));
            color: var(--trend-color, var(--success));
        }

        /* Progress Ring */
        .progress-ring-container {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding: var(--space-2);
            background: var(--bg-elevated);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            margin-bottom: var(--space-2);
        }

        .progress-ring {
            position: relative;
            width: 80px;
            height: 80px;
            flex-shrink: 0;
        }

        .progress-ring svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .progress-ring-bg {
            fill: none;
            stroke: var(--bg-sunken);
            stroke-width: 8;
        }

        .progress-ring-fill {
            fill: none;
            stroke: url(#gradient);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 220;
            stroke-dashoffset: 220;
            transition: stroke-dashoffset 1.5s var(--ease-out-expo);
        }

        .progress-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 20px;
            color: var(--text-primary);
        }

        .progress-info h3 {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 4px;
        }

        .progress-info p {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        /* Chart Container */
        .chart-card {
            background: var(--bg-elevated);
            border-radius: var(--radius-xl);
            padding: var(--space-2);
            border: 1px solid var(--border);
            margin-bottom: var(--space-2);
            box-shadow: var(--shadow-sm);
        }

        .chart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--space-2);
        }

        .chart-title {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chart-badge {
            background: var(--primary-50);
            color: var(--primary-600);
            padding: 6px 12px;
            border-radius: var(--radius-full);
            font-size: 12px;
            font-weight: 700;
            border: 1px solid var(--primary-100);
        }

        .chart-container {
            position: relative;
            height: 200px;
        }

        /* Subject Performance */
        .subject-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-1);
        }

        .subject-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--bg-elevated);
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            transition: all var(--duration-fast);
        }

        .subject-item:active {
            transform: scale(0.98);
            background: var(--bg-sunken);
        }

        .subject-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .subject-details {
            flex: 1;
            min-width: 0;
        }

        .subject-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .subject-name {
            font-weight: 700;
            font-size: 15px;
            color: var(--text-primary);
        }

        .subject-score {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 15px;
            color: var(--text-primary);
        }

        .subject-bar-bg {
            height: 6px;
            background: var(--bg-sunken);
            border-radius: var(--radius-full);
            overflow: hidden;
            position: relative;
        }

        .subject-bar-fill {
            height: 100%;
            border-radius: var(--radius-full);
            background: var(--subject-color, var(--gradient-primary));
            transition: width 1s var(--ease-out-expo);
            position: relative;
            overflow: hidden;
        }

        .subject-bar-fill::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(100%);
            }
        }

        /* Insight Cards */
        .insights-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--space-1);
            margin-bottom: var(--space-2);
        }

        .insight-card-premium {
            background: var(--bg-elevated);
            border-radius: var(--radius-lg);
            padding: var(--space-2);
            border: 1px solid var(--border);
            display: flex;
            gap: 16px;
            align-items: flex-start;
            transition: all var(--duration-base);
        }

        .insight-card-premium:active {
            transform: scale(0.98);
            box-shadow: var(--shadow-sm);
        }

        .insight-icon-premium {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
            background: var(--insight-bg, rgba(99, 102, 241, 0.1));
        }

        .insight-content h4 {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .insight-content p {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .insight-cta {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 8px;
            font-size: 13px;
            font-weight: 700;
            color: var(--primary-500);
        }

        /* Recent Attempts */
        .attempt-card {
            background: var(--bg-elevated);
            border-radius: var(--radius-lg);
            padding: var(--space-2);
            border: 1px solid var(--border);
            margin-bottom: var(--space-1);
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all var(--duration-fast);
        }

        .attempt-card:active {
            transform: scale(0.98);
            background: var(--bg-sunken);
        }

        .attempt-score-ring {
            position: relative;
            width: 56px;
            height: 56px;
            flex-shrink: 0;
        }

        .attempt-score-ring svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .ring-bg {
            fill: none;
            stroke: var(--bg-sunken);
            stroke-width: 6;
        }

        .ring-fill {
            fill: none;
            stroke: var(--score-color, var(--primary-500));
            stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 151;
            stroke-dashoffset: 151;
            transition: stroke-dashoffset 1s var(--ease-out-expo);
        }

        .attempt-score-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 14px;
            color: var(--text-primary);
        }

        .attempt-details {
            flex: 1;
            min-width: 0;
        }

        .attempt-title {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .attempt-meta {
            font-size: 13px;
            color: var(--text-tertiary);
            display: flex;
            gap: 12px;
        }

        .attempt-arrow {
            color: var(--text-tertiary);
            font-size: 20px;
        }

        /* Loading Skeletons */
        .skeleton {
            background: linear-gradient(90deg, var(--bg-sunken) 25%, var(--bg-hover, rgba(99, 102, 241, 0.05)) 50%, var(--bg-sunken) 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
            border-radius: var(--radius-md);
        }

        @keyframes skeleton-loading {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        .skeleton-text {
            height: 16px;
            margin-bottom: 8px;
            width: 60%;
        }

        .skeleton-text.short {
            width: 40%;
        }

        .skeleton-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
        }

        .skeleton-card {
            height: 100px;
            margin-bottom: var(--space-1);
        }

        /* Bottom Navigation - Floating Island */
        .bottom-nav {
            position: fixed;
            bottom: calc(var(--space-2) + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: calc(100% - var(--space-3));
            max-width: 400px;
        }

        .nav-island {
            display: flex;
            align-items: center;
            justify-content: space-around;
            background: rgba(var(--bg-elevated), 0.9);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: var(--radius-2xl);
            padding: 8px;
            box-shadow: var(--shadow-lg), 0 0 0 1px var(--border);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 8px 16px;
            color: var(--text-tertiary);
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
            border-radius: var(--radius-md);
            transition: all var(--duration-fast);
            min-width: 60px;
            position: relative;
        }

        .nav-item i {
            font-size: 22px;
            transition: all var(--duration-fast);
        }

        .nav-item.active {
            color: var(--primary-500);
            background: rgba(99, 102, 241, 0.1);
        }

        .nav-item.active i {
            transform: translateY(-2px);
        }

        .nav-center-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--gradient-primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: -20px 0;
            box-shadow: var(--shadow-glow);
            border: 3px solid var(--bg);
            transition: all var(--duration-base) var(--ease-spring);
            position: relative;
            overflow: hidden;
        }

        .nav-center-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.3) 0%, transparent 50%);
        }

        .nav-center-btn:active {
            transform: scale(0.9) rotate(45deg);
        }

        /* Empty States */
        .empty-state {
            text-align: center;
            padding: var(--space-4) var(--space-2);
            color: var(--text-tertiary);
        }

        .empty-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto var(--space-2);
            background: var(--bg-sunken);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-family: var(--font-display);
            font-size: 20px;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        /* Toast Notification */
        .toast-premium {
            position: fixed;
            top: calc(var(--space-2) + env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--bg-elevated);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: var(--radius-full);
            box-shadow: var(--shadow-lg);
            font-weight: 600;
            font-size: 14px;
            z-index: 9999;
            opacity: 0;
            transition: all var(--duration-base) var(--ease-out-expo);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast-premium.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.6s var(--ease-out-expo) backwards;
        }

        .slide-up {
            animation: slideUp 0.5s var(--ease-out-expo) backwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .delay-1 {
            animation-delay: 0.1s;
        }

        .delay-2 {
            animation-delay: 0.2s;
        }

        .delay-3 {
            animation-delay: 0.3s;
        }

        .delay-4 {
            animation-delay: 0.4s;
        }

        /* Pull to refresh indicator */
        .pull-indicator {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            z-index: 99;
            transition: opacity 0.2s;
        }

        .pull-indicator.visible {
            opacity: 1;
        }

        .pull-indicator i {
            font-size: 24px;
            color: var(--primary-500);
            animation: rotate 1s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* Utility classes */
        .hidden {
            display: none !important;
        }

        .text-success {
            color: var(--success);
        }

        .text-warning {
            color: var(--warning);
        }

        .text-danger {
            color: var(--danger);
        }

        .bg-success-soft {
            background: rgba(16, 185, 129, 0.1);
        }

        .bg-warning-soft {
            background: rgba(245, 158, 11, 0.1);
        }

        .bg-danger-soft {
            background: rgba(239, 68, 68, 0.1);
        }
    </style>
    <base target="_blank">
</head>

<body>
    <!-- SVG Gradients Definition -->
    <svg width="0" height="0" style="position:absolute;">
        <defs>
            <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
            </linearGradient>
        </defs>
    </svg>

    <!-- Ambient Background -->
    <div class="ambient-bg">
        <div class="ambient-orb orb-1"></div>
        <div class="ambient-orb orb-2"></div>
    </div>

    <!-- Pull to Refresh Indicator -->
    <div class="pull-indicator" id="pullIndicator">
        <i class="ri-loader-4-line"></i>
    </div>

    <div class="app-container">
        <!-- Header -->
        <header class="header slide-up">
            <div class="header-content">
                <div class="user-info">
                    <div class="avatar" id="userAvatar">S</div>
                    <div class="greeting">
                        <span class="greeting-text">Welcome back</span>
                        <span class="user-name" id="userName">Student</span>
                    </div>
                </div>
                <div class="streak-badge">
                    <i class="ri-fire-fill"></i>
                    <span id="streakCount">5</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main>
            <!-- Quick Stats -->
            <div class="section-header slide-up delay-3">
                <h2 class="section-title">
                    <i class="ri-bar-chart-box-fill" style="color: var(--primary-500);"></i>
                    Performance
                </h2>
                <button class="section-action" onclick="showFilters()">Filter</button>
            </div>

            <div class="quick-stats-grid slide-up delay-3" id="statsGrid">
                <!-- Skeleton Loading -->
                <div class="stat-card-premium skeleton-card"></div>
                <div class="stat-card-premium skeleton-card"></div>
                <div class="stat-card-premium skeleton-card"></div>
                <div class="stat-card-premium skeleton-card"></div>
            </div>

            <!-- Chart Section -->
            <div class="chart-card slide-up delay-4">
                <div class="chart-header">
                    <h3 class="chart-title">
                        <i class="ri-line-chart-fill" style="color: var(--primary-500);"></i>
                        Score Trend
                    </h3>
                    <span class="chart-badge" id="trendBadge">Loading...</span>
                </div>
                <div class="chart-container">
                    <canvas id="scoreChart"></canvas>
                </div>
            </div>

            <!-- Focus Areas (AI Insights) -->
            <div class="section-header">
                <h2 class="section-title">
                    <i class="ri-lightbulb-flash-fill" style="color: var(--warning);"></i>
                    AI Insights
                </h2>
            </div>

            <div class="insights-grid" id="insightsGrid">
                <div class="insight-card-premium skeleton" style="height: 100px;"></div>
                <div class="insight-card-premium skeleton" style="height: 100px;"></div>
            </div>

            <!-- Subject Performance -->
            <div class="section-header">
                <h2 class="section-title">
                    <i class="ri-pie-chart-2-fill" style="color: var(--accent-purple);"></i>
                    Subjects
                </h2>
            </div>

            <div class="subject-list" id="subjectList">
                <div class="subject-item skeleton" style="height: 64px;"></div>
                <div class="subject-item skeleton" style="height: 64px;"></div>
                <div class="subject-item skeleton" style="height: 64px;"></div>
            </div>

            <!-- Recent Attempts -->
            <div class="section-header">
                <h2 class="section-title">
                    <i class="ri-history-fill" style="color: var(--accent-cyan);"></i>
                    Recent
                </h2>
                <button class="section-action" onclick="viewAllAttempts()">View All</button>
            </div>

            <div id="attemptsList">
                <div class="attempt-card skeleton" style="height: 88px;"></div>
                <div class="attempt-card skeleton" style="height: 88px;"></div>
            </div>

            <div style="height: 100px;"></div> <!-- Spacer for bottom nav -->
        </main>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <div class="nav-island">
            <a href="/dashboard.html" class="nav-item active">
                <i class="ri-dashboard-fill"></i>
                <span>Home</span>
            </a>
            <a href="/mock_test/full_mock_test_homepage.html" class="nav-item">
                <i class="ri-file-list-3-line"></i>
                <span>Mocks</span>
            </a>
            <button class="nav-center-btn" onclick="startQuickMock()">
                <i class="ri-flashlight-fill"></i>
            </button>
            <a href="/ai_tutor.html" class="nav-item">
                <i class="ri-robot-2-line"></i>
                <span>AI</span>
            </a>
            <a href="/smart_notes.html" class="nav-item">
                <i class="ri-book-2-line"></i>
                <span>Notes</span>
            </a>
        </div>
    </nav>

    <!-- Toast -->
    <div class="toast-premium" id="toast">
        <i class="ri-information-line"></i>
        <span id="toastMsg">Message</span>
    </div>

    <script>
        // Configuration & State (Preserved from original)
        const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
            ? 'http://localhost:8080'
            : 'https://api.iisersmartprep.space';

        let token = null;
        let allAttempts = [];
        let scoreChart = null;
        let userStats = null;
        let touchStartY = 0;
        let isRefreshing = false;

        // Subject Configurations with Icons and Colors
        const SUBJECT_CONFIG = {
            Physics: { icon: '⚛️', color: '#ef4444', bg: 'rgba(239, 68, 68, 0.1)' },
            Chemistry: { icon: '⚗️', color: '#3b82f6', bg: 'rgba(59, 130, 246, 0.1)' },
            Mathematics: { icon: '📐', color: '#f59e0b', bg: 'rgba(245, 158, 11, 0.1)' },
            Biology: { icon: '🧬', color: '#10b981', bg: 'rgba(16, 185, 129, 0.1)' },
            Mixed: { icon: '📚', color: '#8b5cf6', bg: 'rgba(139, 92, 246, 0.1)' },
            General: { icon: '📝', color: '#6366f1', bg: 'rgba(99, 102, 241, 0.1)' }
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            token = localStorage.getItem('IAT_TOKEN');
            if (!token) {
                window.location.href = '/login.html';
                return;
            }

            // Theme setup
            const savedTheme = localStorage.getItem('iat_theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);

            // Pull to refresh setup
            setupPullToRefresh();

            // Load data
            await loadDashboardData();
        });

        // API Helper (Preserved)
        async function apiFetch(endpoint) {
            const res = await fetch(`${API_BASE}${endpoint}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!res.ok) throw new Error(`API ${res.status}`);
            return res.json();
        }

        // Main Data Load
        async function loadDashboardData() {
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                const userId = payload.id || payload.userId || payload.sub;

                const [statsRes, progressRes, subjectRes] = await Promise.all([
                    apiFetch(`/api/user-stats/${userId}`),
                    apiFetch(`/api/user-progress/${userId}`),
                    apiFetch(`/api/subject-performance/${userId}`)
                ]);

                allAttempts = progressRes.data || [];
                userStats = statsRes.stats;

                // Update UI
                updateUserInfo();
                renderQuickStats(userStats);
                renderScoreChart(allAttempts);
                renderSubjects(subjectRes.performance || []);
                renderInsights(userStats, subjectRes.performance || []);
                renderAttempts(allAttempts.slice(0, 5));

            } catch (err) {
                console.error('Dashboard error:', err);
                showToast('Failed to load data', 'error');
            }
        }

        // Update User Info
        function updateUserInfo() {
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                const name = payload.name || payload.email?.split('@')[0] || 'Student';
                const initial = name.charAt(0).toUpperCase();

                document.getElementById('userName').textContent = name;
                document.getElementById('userAvatar').textContent = initial;

                // Streak (mock data if not available)
                const streak = payload.streak || Math.floor(Math.random() * 10) + 1;
                document.getElementById('streakCount').textContent = streak;
            } catch (e) {
                console.error('Error parsing token:', e);
            }
        }


        // Quick Stats Cards
        function renderQuickStats(stats) {
            const trend = stats.recent_trend || 'stable';
            const trendIcon = trend === 'improving' ? '↑' : trend === 'declining' ? '↓' : '→';
            const trendColor = trend === 'improving' ? 'var(--success)' : trend === 'declining' ? 'var(--danger)' : 'var(--warning)';
            const trendBg = trend === 'improving' ? 'rgba(16, 185, 129, 0.1)' : trend === 'declining' ? 'rgba(239, 68, 68, 0.1)' : 'rgba(245, 158, 11, 0.1)';

            const cards = [
                {
                    icon: '🏆',
                    label: 'Best Score',
                    value: stats.best_score || 0,
                    sub: '/240',
                    trend: null,
                    accent: 'linear-gradient(135deg, #6366f1, #06b6d4)',
                    iconBg: 'rgba(99, 102, 241, 0.1)',
                    iconColor: '#6366f1'
                },
                {
                    icon: '📊',
                    label: 'Average',
                    value: stats.avg_score || '0.0',
                    sub: '',
                    trend: null,
                    accent: 'linear-gradient(135deg, #06b6d4, #14b8a6)',
                    iconBg: 'rgba(6, 182, 212, 0.1)',
                    iconColor: '#06b6d4'
                },
                {
                    icon: '🎯',
                    label: 'Accuracy',
                    value: stats.accuracy || '0',
                    sub: '%',
                    trend: null,
                    accent: 'linear-gradient(135deg, #10b981, #34d399)',
                    iconBg: 'rgba(16, 185, 129, 0.1)',
                    iconColor: '#10b981'
                },
                {
                    icon: trendIcon,
                    label: 'Trend',
                    value: stats.improvement || 0,
                    sub: '%',
                    trend: { icon: trendIcon, color: trendColor, bg: trendBg },
                    accent: 'linear-gradient(135deg, #f59e0b, #fbbf24)',
                    iconBg: trendBg,
                    iconColor: trendColor
                }
            ];

            const grid = document.getElementById('statsGrid');
            grid.innerHTML = cards.map((card, i) => `
                <div class="stat-card-premium fade-in" style="animation-delay: ${i * 0.1}s; --card-accent: ${card.accent};">
                    <div class="stat-icon-wrap" style="background: ${card.iconBg}; color: ${card.iconColor};">
                        ${card.icon}
                    </div>
                    <div class="stat-label-premium">${card.label}</div>
                    <div class="stat-value-premium">${card.value}${card.sub}</div>
                    ${card.trend ? `
                        <div class="stat-trend" style="background: ${card.trend.bg}; color: ${card.trend.color};">
                            ${card.trend.icon} ${trend}
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        // Score Chart
        function renderScoreChart(attempts) {
            const ctx = document.getElementById('scoreChart').getContext('2d');
            const container = ctx.canvas.parentElement;

            if (!attempts || attempts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📉</div>
                        <h3>No data yet</h3>
                        <p>Complete your first mock test</p>
                    </div>
                `;
                document.getElementById('trendBadge').textContent = 'Start Now';
                return;
            }

            const sorted = [...attempts].sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
            const recent = sorted.slice(-7); // Last 7 attempts

            const labels = recent.map(a => {
                const d = new Date(a.created_at);
                return `${d.getDate()}/${d.getMonth() + 1}`;
            });
            const scores = recent.map(a => a.score);

            // Trend badge
            if (scores.length > 1) {
                const diff = scores[scores.length - 1] - scores[scores.length - 2];
                const badge = document.getElementById('trendBadge');
                badge.textContent = diff >= 0 ? `+${diff}` : `${diff}`;
                badge.style.color = diff >= 0 ? 'var(--success)' : 'var(--danger)';
                badge.style.background = diff >= 0 ? 'rgba(16, 185, 129, 0.1)' : 'rgba(239, 68, 68, 0.1)';
                badge.style.borderColor = diff >= 0 ? 'rgba(16, 185, 129, 0.2)' : 'rgba(239, 68, 68, 0.2)';
            }

            const gradient = ctx.createLinearGradient(0, 0, 0, 200);
            gradient.addColorStop(0, 'rgba(99, 102, 241, 0.3)');
            gradient.addColorStop(1, 'rgba(99, 102, 241, 0)');

            if (scoreChart) scoreChart.destroy();

            scoreChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        label: 'Score',
                        data: scores,
                        borderColor: '#6366f1',
                        backgroundColor: gradient,
                        borderWidth: 3,
                        tension: 0.4,
                        fill: true,
                        pointBackgroundColor: '#fff',
                        pointBorderColor: '#6366f1',
                        pointBorderWidth: 2,
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: { color: 'var(--text-tertiary)', font: { size: 11 } }
                        },
                        y: {
                            min: 0, max: 240,
                            grid: { color: 'var(--border)', borderDash: [5, 5] },
                            ticks: { color: 'var(--text-tertiary)', font: { size: 11 }, stepSize: 60 }
                        }
                    },
                    interaction: { intersect: false, mode: 'index' },
                    onHover: (e, elements) => {
                        e.native.target.style.cursor = elements.length ? 'pointer' : 'default';
                    }
                }
            });
        }

        // Subject Performance
        function renderSubjects(performance) {
            const container = document.getElementById('subjectList');

            if (!performance || performance.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No subject data available</p></div>';
                return;
            }

            container.innerHTML = performance.map((sub, i) => {
                const config = SUBJECT_CONFIG[sub.subject] || SUBJECT_CONFIG.General;
                const accuracy = parseFloat(sub.accuracy);

                return `
                    <div class="subject-item fade-in" style="animation-delay: ${i * 0.1}s;">
                        <div class="subject-icon" style="background: ${config.bg};">
                            ${config.icon}
                        </div>
                        <div class="subject-details">
                            <div class="subject-header">
                                <span class="subject-name">${sub.subject}</span>
                                <span class="subject-score">${accuracy.toFixed(1)}%</span>
                            </div>
                            <div class="subject-bar-bg">
                                <div class="subject-bar-fill" 
                                     style="width: 0%; --subject-color: ${config.color}; background: linear-gradient(90deg, ${config.color}, ${config.color}dd);"
                                     data-width="${accuracy}"></div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // Animate bars
            setTimeout(() => {
                document.querySelectorAll('.subject-bar-fill').forEach(bar => {
                    bar.style.width = bar.dataset.width + '%';
                });
            }, 100);
        }

        // AI Insights
        function renderInsights(stats, performance) {
            const container = document.getElementById('insightsGrid');

            if (!stats || stats.total_attempts === 0) {
                container.innerHTML = `
                    <div class="insight-card-premium">
                        <div class="insight-icon-premium" style="background: rgba(99, 102, 241, 0.1);">🎯</div>
                        <div class="insight-content">
                            <h4>Start Your Journey</h4>
                            <p>Take your first mock test to unlock personalized AI insights</p>
                            <span class="insight-cta">Start Mock <i class="ri-arrow-right-line"></i></span>
                        </div>
                    </div>
                `;
                return;
            }

            const weakSubject = performance?.length > 0
                ? [...performance].sort((a, b) => parseFloat(a.accuracy) - parseFloat(b.accuracy))[0]
                : null;

            const insights = [
                {
                    icon: '🔥',
                    bg: 'rgba(239, 68, 68, 0.1)',
                    title: 'Focus Area',
                    text: weakSubject
                        ? `Improve ${weakSubject.subject} by 20% with targeted practice (current: ${weakSubject.accuracy}%)`
                        : 'Keep practicing consistently across all subjects',
                    cta: 'Practice Now'
                },
                {
                    icon: '⚡',
                    bg: 'rgba(245, 158, 11, 0.1)',
                    title: 'Quick Win',
                    text: parseFloat(stats.accuracy) < 70
                        ? 'Focus on easy questions first. Avoid guessing to improve accuracy.'
                        : 'Great accuracy! Now work on increasing your attempt speed.',
                    cta: 'View Strategy'
                }
            ];

            container.innerHTML = insights.map((ins, i) => `
                <div class="insight-card-premium fade-in" style="animation-delay: ${i * 0.1}s;">
                    <div class="insight-icon-premium" style="background: ${ins.bg};">${ins.icon}</div>
                    <div class="insight-content">
                        <h4>${ins.title}</h4>
                        <p>${ins.text}</p>
                        <span class="insight-cta">${ins.cta} <i class="ri-arrow-right-line"></i></span>
                    </div>
                </div>
            `).join('');
        }

        // Recent Attempts
        function renderAttempts(attempts) {
            const container = document.getElementById('attemptsList');

            if (!attempts || attempts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📝</div>
                        <h3>No attempts yet</h3>
                        <button class="next-action-btn" style="margin-top: 16px;" onclick="startQuickMock()">Start First Mock</button>
                    </div>
                `;
                return;
            }

            container.innerHTML = attempts.map((attempt, i) => {
                const score = attempt.score;
                const maxScore = 240;
                const percentage = (score / maxScore) * 100;
                const circumference = 2 * Math.PI * 24; // radius 24
                const offset = circumference - (percentage / 100) * circumference;
                const color = score >= 160 ? '#10b981' : score >= 100 ? '#f59e0b' : '#ef4444';

                const date = new Date(attempt.created_at).toLocaleDateString('en-IN', {
                    day: 'numeric', month: 'short'
                });

                return `
                    <div class="attempt-card fade-in" style="animation-delay: ${i * 0.05}s;">
                        <div class="attempt-score-ring">
                            <svg viewBox="0 0 56 56">
                                <circle class="ring-bg" cx="28" cy="28" r="24"/>
                                <circle class="ring-fill" cx="28" cy="28" r="24" 
                                        style="stroke: ${color}; stroke-dashoffset: ${offset};"/>
                            </svg>
                            <div class="attempt-score-text">${score}</div>
                        </div>
                        <div class="attempt-details">
                            <div class="attempt-title">${attempt.mock_title || 'Mock Test'}</div>
                            <div class="attempt-meta">
                                <span>${attempt.subject || 'Mixed'}</span>
                                <span>•</span>
                                <span>${date}</span>
                            </div>
                        </div>
                        <i class="ri-arrow-right-s-line attempt-arrow"></i>
                    </div>
                `;
            }).join('');
        }


        // Pull to Refresh
        function setupPullToRefresh() {
            document.addEventListener('touchstart', e => {
                touchStartY = e.touches[0].clientY;
            }, { passive: true });

            document.addEventListener('touchmove', e => {
                if (window.scrollY === 0 && !isRefreshing) {
                    const pull = e.touches[0].clientY - touchStartY;
                    if (pull > 0 && pull < 100) {
                        document.getElementById('pullIndicator').classList.add('visible');
                        document.body.style.transform = `translateY(${pull * 0.3}px)`;
                    }
                }
            }, { passive: true });

            document.addEventListener('touchend', async () => {
                const pull = document.getElementById('pullIndicator');
                if (pull.classList.contains('visible') && !isRefreshing) {
                    isRefreshing = true;
                    document.body.style.transition = 'transform 0.3s';
                    document.body.style.transform = 'translateY(50px)';

                    await loadDashboardData();

                    setTimeout(() => {
                        document.body.style.transform = 'translateY(0)';
                        pull.classList.remove('visible');
                        isRefreshing = false;
                        showToast('Dashboard updated');
                    }, 500);
                } else {
                    document.body.style.transform = 'translateY(0)';
                    pull.classList.remove('visible');
                }
            });
        }

        // Actions
        function startQuickMock() {
            haptic();
            window.location.href = '/mock_test/quick_mock_homepage.html';
        }


        function showFilters() {
            haptic();
            showToast('Filter feature coming soon');
        }

        function viewAllAttempts() {
            haptic();
            showToast('View all attempts');
        }

        // Utilities
        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toastMsg');
            msgEl.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function haptic() {
            if (navigator.vibrate) navigator.vibrate(10);
        }

        // Handle resize for charts
        window.addEventListener('resize', () => {
            if (scoreChart) {
                const sorted = [...allAttempts].sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
                renderScoreChart(sorted);
            }
        });
    </script>
</body>
