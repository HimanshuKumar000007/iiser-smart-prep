<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicon Setup -->
    <link rel="icon" href="/favicon.ico">

    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#000000">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WHHM4FTNHG"></script>

        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }

<body>
    <button onclick="pay()">Pay ₹1</button>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="/config.js"></script>
    <script src="/assets/js/mixpanel-tracker.js"></script>
    <script>
        async function pay() {
            const res = await fetch("https://api.iisersmartprep.space/api/create-order", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                }
            });

            const data = await res.json();
            console.log("ORDER DATA:", data);

            const options = {
                key: data.key,
                amount: data.amount,
                currency: data.currency,
                order_id: data.order_id,
                name: "IISER Smart Prep",
                description: "Pro Plan",

                handler: function (response) {
                    alert("Payment successful 🎉");
                }
            };

            const rzp = new Razorpay(options);
            rzp.open();
        }
    </script>
</body>

</html>
