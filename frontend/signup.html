<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Sign Up | IISER SmartPrep</title>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const redirect = urlParams.get('redirect') || 'dashboard-react/index.html';
    window.location.replace("login.html?mode=signup&redirect=" + encodeURIComponent(redirect));
  </script>
</head>
<body style="background: #f8fafc;">
</body>
</html>
