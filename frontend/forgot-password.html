<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | IISER Smart Prep</title>
  <meta name="description" content="Reset your IISER Smart Prep password. We will send a secure link to your email.">
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" href="/favicon-96x96.png" type="image/png">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta property="og:image" content="https://iisersmartprep.space/web-app-manifest-512x512.png">
  <meta property="og:title" content="Forgot Password | IISER Smart Prep">
  <meta name="theme-color" content="#eef4fb">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WHHM4FTNHG"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-WHHM4FTNHG');
  </script>

  <style>
    :root {
      --primary: #4f7cff;
      --primary-dark: #3b66db;
      --accent: #8b5cf6;
      --cyan: #22d3ee;
      --bg: #eef4fb;
      --bg-soft: #f7f9fc;
      --panel: #ffffff;
      --panel-2: #f1f5f9;
      --border: rgba(15, 23, 42, 0.08);
      --border-strong: rgba(15, 23, 42, 0.12);
      --text: #0f172a;
      --text-dim: #475569;
      --text-faint: #64748b;
      --error: #ef4444;
      --success: #10b981;
      --grad-primary: linear-gradient(135deg, #4f7cff 0%, #8b5cf6 55%, #22d3ee 100%);
      --radius: 20px;
      --radius-sm: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient background glow */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background:
        radial-gradient(
          circle at 20% 10%,
          rgba(79, 124, 255, 0.08),
          transparent 60%
        ),
        radial-gradient(
          circle at 80% 50%,
          rgba(139, 92, 246, 0.06),
          transparent 60%
        );
      pointer-events: none;
      z-index: 0;
    }

    /* ── Card ── */
    .auth-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      padding: 1.5rem;
    }

    .auth-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2.5rem;
      box-shadow: 0 20px 50px -15px rgba(15, 23, 42, 0.08);
      animation: cardIn 0.5s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Icon badge */
    .icon-badge {
      width: 64px; height: 64px;
      background: rgba(79, 124, 255, 0.08);
      border: 1px solid rgba(79, 124, 255, 0.2);
      border-radius: 20px;
      display: flex; align-items:center; justify-content:center;
      font-size: 1.8rem;
      margin: 0 auto 1.5rem;
      box-shadow: 0 8px 20px rgba(79, 124, 255, 0.1);
    }

    /* ── Brand ── */
    .brand {
      text-align: center;
      margin-bottom: 2rem;
    }
    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      font-family: 'Space Grotesk', sans-serif;
    }
    .brand-icon {
      width: 32px; height: 32px;
      background: var(--grad-primary);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.95rem;
      font-weight: 700;
      color: white;
    }
    .brand-name {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.5px;
    }
    .brand-name span {
      background: var(--grad-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ── Heading ── */
    .page-heading { text-align: center; margin-bottom: 1.75rem; }
    .page-heading h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.5px;
      margin-bottom: 0.35rem;
    }
    .page-heading p {
      font-size: 0.9rem;
      color: var(--text-dim);
      line-height: 1.5;
    }

    /* ── Form ── */
    .form-group { margin-bottom: 1.25rem; }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 0.5rem;
    }

    .input-wrapper {
      position: relative;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      opacity: 0.6;
      pointer-events: none;
    }

    input[type="email"] {
      width: 100%;
      padding: 0.85rem 0.9rem 0.85rem 2.6rem;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      color: var(--text);
      transition: all 0.2s;
      -webkit-appearance: none;
    }
    input::placeholder { color: rgba(15, 23, 42, 0.35); }
    input:focus {
      outline: none;
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(79, 124, 255, 0.12);
    }

    /* ── Submit Button ── */
    .btn-submit {
      width: 100%;
      padding: 0.9rem;
      background: var(--grad-primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: all 0.25s;
      box-shadow: 0 4px 18px rgba(79, 124, 255, 0.25);
      letter-spacing: 0.2px;
    }
    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(79, 124, 255, 0.35);
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .btn-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* Loading spinner */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error / Success msg ── */
    .msg-box {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      text-align: center;
      display: none;
      animation: fadeIn 0.2s ease;
    }
    .msg-box.error {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: var(--error);
    }
    .msg-box.success {
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: var(--success);
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

    /* Success state */
    .success-state {
      display: none;
      text-align: center;
      animation: fadeIn 0.4s ease;
    }
    .success-state .success-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    .success-state h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .success-state p {
      font-size: 0.9rem;
      color: var(--text-dim);
      line-height: 1.6;
    }

    .back-links {
      margin-top: 1.5rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .back-link {
      font-size: 0.85rem;
      color: var(--text-faint);
      text-decoration: none;
      transition: color 0.2s;
      font-weight: 500;
    }
    .back-link:hover { color: var(--primary); }
    .back-link.primary-link { color: var(--primary); font-weight: 600; }
  </style>
</head>

<body>
  <div class="auth-wrapper">
    <div class="auth-card">

      <!-- Brand -->
      <div class="brand">
        <a href="index.html" class="brand-logo">
          <div class="brand-icon">IS</div>
          <span class="brand-name">IISER <span>Smart Prep</span></span>
        </a>
      </div>

      <!-- Form state -->
      <div id="form-state">
        <div class="icon-badge">🔑</div>
        <div class="page-heading">
          <h2>Forgot password?</h2>
          <p>No worries! Enter your email and we'll send you a secure reset link.</p>
        </div>

        <form onsubmit="sendReset(event)">
          <div class="form-group">
            <label>Email Address</label>
            <div class="input-wrapper">
              <span class="input-icon">✉️</span>
              <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
            </div>
          </div>

          <div class="msg-box error" id="error-msg"></div>

          <button type="submit" class="btn-submit" id="send-btn">
            <span class="btn-inner">
              <div class="spinner" id="send-spin"></div>
              <span id="send-text">Send Reset Link →</span>
            </span>
          </button>
        </form>
      </div>

      <!-- Success state -->
      <div class="success-state" id="success-state">
        <div class="success-icon">📬</div>
        <h3>Check your inbox!</h3>
        <p>We've sent a password reset link to <strong id="sent-email"></strong>.<br>The link expires in <strong>1 hour</strong>.</p>
      </div>

      <div class="back-links">
        <a href="login.html" class="back-link primary-link">← Back to Login</a>
        <a href="index.html" class="back-link">Go to Home</a>
      </div>
    </div>
  </div>

  <script>
    async function sendReset(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const errEl = document.getElementById('error-msg');
      errEl.style.display = 'none';

      const btn = document.getElementById('send-btn');
      btn.disabled = true;
      document.getElementById('send-spin').style.display = 'block';
      document.getElementById('send-text').textContent = 'Sending...';

      try {
        const res = await fetch('https://api.iisersmartprep.space/api/forgot-password', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({email})
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Something went wrong');

        // Show success state
        document.getElementById('sent-email').textContent = email;
        document.getElementById('form-state').style.display = 'none';
        document.getElementById('success-state').style.display = 'block';

      } catch(err) {
        errEl.className = 'msg-box error';
        errEl.textContent = err.message;
        errEl.style.display = 'block';
        btn.disabled = false;
        document.getElementById('send-spin').style.display = 'none';
        document.getElementById('send-text').textContent = 'Send Reset Link →';
      }
    }
  </script>
</body>
</html>
