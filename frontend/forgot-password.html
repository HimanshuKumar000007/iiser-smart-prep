<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Forgot Password | IISER Edge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .card {
      background: white;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 1rem;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 1rem 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
    }

    .msg {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>Forgot Password</h2>
    <p style="text-align:center;color:#64748b;">
      Enter your registered email
    </p>

    <input type="email" id="email" placeholder="Email address" required />
    <button onclick="sendReset()">Send Reset Link</button>

    <div class="msg" id="msg"></div>
  </div>

  <script src="config.js"></script>
  <script>
    async function sendReset() {
      const email = document.getElementById("email").value;
      const msg = document.getElementById("msg");
      msg.innerText = "Sending...";

      try {
        const res = await fetch(`${API_BASE_URL}/forgot-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });

        const data = await res.json();

        if (res.ok) {
          msg.style.color = "green";
          msg.innerText = "✅ Reset link generated. Check email soon.";
        } else {
          msg.style.color = "red";
          msg.innerText = data.error || "Something went wrong";
        }
      } catch (err) {
        msg.style.color = "red";
        msg.innerText = "Server error";
      }
    }
  </script>

</body>

</html>
