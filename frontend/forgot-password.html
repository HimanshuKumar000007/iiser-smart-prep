<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | IISER Smart Prep</title>
  <meta name="description" content="Reset your IISER Smart Prep password. We will send a secure link to your email.">
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" href="/favicon-96x96.png" type="image/png">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta property="og:image" content="https://iisersmartprep.space/web-app-manifest-512x512.png">
  <meta property="og:title" content="Forgot Password | IISER Smart Prep">
  <meta name="theme-color" content="#0a0a1a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WHHM4FTNHG"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-WHHM4FTNHG');
  </script>

  <style>
    :root {
      --primary: #6366f1;
      --accent: #a78bfa;
      --bg: #080818;
      --card-bg: rgba(255,255,255,0.04);
      --card-border: rgba(255,255,255,0.09);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --input-bg: rgba(255,255,255,0.06);
      --input-border: rgba(255,255,255,0.12);
      --error: #f87171;
      --success: #34d399;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(99,102,241,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
    }
    .bg-orbs { position:fixed; inset:0; pointer-events:none; z-index:0; }
    .orb { position:absolute; border-radius:50%; filter:blur(80px); opacity:0.18; animation:orbFloat 8s ease-in-out infinite alternate; }
    .orb-1 { width:500px;height:500px;background:#6366f1;top:-150px;left:-100px; }
    .orb-2 { width:350px;height:350px;background:#a78bfa;bottom:-80px;right:-60px;animation-delay:-3s; }
    @keyframes orbFloat {
      0% { transform:translate(0,0) scale(1); }
      100% { transform:translate(25px,15px) scale(1.06); }
    }

    .auth-wrapper {
      position:relative; z-index:10;
      width:100%; max-width:420px; padding:1rem;
    }

    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 2.5rem;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.05) inset, 0 40px 80px rgba(0,0,0,0.5), 0 0 60px rgba(99,102,241,0.08);
      animation: cardIn 0.5s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes cardIn {
      from { opacity:0; transform:translateY(24px) scale(0.97); }
      to   { opacity:1; transform:translateY(0) scale(1); }
    }

    /* Icon badge */
    .icon-badge {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, rgba(99,102,241,0.2), rgba(167,139,250,0.2));
      border: 1px solid rgba(99,102,241,0.3);
      border-radius: 20px;
      display: flex; align-items:center; justify-content:center;
      font-size: 1.8rem;
      margin: 0 auto 1.5rem;
      box-shadow: 0 0 30px rgba(99,102,241,0.2);
    }

    .page-heading { text-align:center; margin-bottom:1.75rem; }
    .page-heading h2 {
      font-size:1.5rem; font-weight:800;
      color:var(--text); letter-spacing:-0.5px; margin-bottom:0.35rem;
    }
    .page-heading p { font-size:0.88rem; color:var(--text-muted); line-height:1.5; }

    .form-group { margin-bottom:1.25rem; }
    label {
      display:block; font-size:0.82rem; font-weight:600;
      color:var(--text-muted); text-transform:uppercase;
      letter-spacing:0.6px; margin-bottom:0.5rem;
    }
    .input-wrapper { position:relative; }
    .input-icon {
      position:absolute; left:14px; top:50%;
      transform:translateY(-50%); font-size:1rem;
      opacity:0.4; pointer-events:none;
    }
    input[type="email"] {
      width:100%; padding:0.8rem 0.9rem 0.8rem 2.6rem;
      background:var(--input-bg); border:1px solid var(--input-border);
      border-radius:12px; font-family:'Inter',sans-serif;
      font-size:0.95rem; color:var(--text); transition:all 0.2s;
    }
    input::placeholder { color:rgba(148,163,184,0.45); }
    input:focus {
      outline:none; border-color:var(--primary);
      background:rgba(99,102,241,0.08);
      box-shadow:0 0 0 3px rgba(99,102,241,0.15);
    }

    .btn-submit {
      width:100%; padding:0.9rem;
      background:linear-gradient(135deg,#6366f1,#818cf8);
      color:white; border:none; border-radius:12px;
      font-family:'Inter',sans-serif; font-size:0.95rem;
      font-weight:700; cursor:pointer; margin-top:0.5rem;
      transition:all 0.25s;
      box-shadow:0 4px 20px rgba(99,102,241,0.35);
    }
    .btn-submit:hover { transform:translateY(-1px); box-shadow:0 8px 28px rgba(99,102,241,0.45); }
    .btn-submit:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
    .btn-inner { display:flex; align-items:center; justify-content:center; gap:8px; }
    .spinner { width:18px;height:18px; border:2px solid rgba(255,255,255,0.3); border-top-color:white; border-radius:50%; animation:spin 0.7s linear infinite; display:none; }
    @keyframes spin { to { transform:rotate(360deg); } }

    .msg-box {
      margin-top:1rem; padding:0.75rem 1rem;
      border-radius:10px; font-size:0.85rem; font-weight:500;
      text-align:center; display:none; animation:fadeIn 0.2s ease;
    }
    .msg-box.error { background:rgba(248,113,113,0.1); border:1px solid rgba(248,113,113,0.25); color:var(--error); }
    .msg-box.success { background:rgba(52,211,153,0.1); border:1px solid rgba(52,211,153,0.25); color:var(--success); }
    @keyframes fadeIn { from{opacity:0;transform:translateY(-4px);} to{opacity:1;transform:translateY(0);} }

    /* Success state */
    .success-state { display:none; text-align:center; animation:fadeIn 0.4s ease; }
    .success-state .success-icon { font-size:3rem; margin-bottom:1rem; }
    .success-state h3 { font-size:1.2rem; font-weight:700; margin-bottom:0.5rem; }
    .success-state p { font-size:0.88rem; color:var(--text-muted); line-height:1.6; }

    .back-links { margin-top:1.5rem; text-align:center; display:flex; flex-direction:column; gap:6px; }
    .back-link { font-size:0.82rem; color:var(--text-muted); text-decoration:none; transition:color 0.2s; }
    .back-link:hover { color:var(--text); }
    .back-link.primary-link { color:var(--accent); font-weight:600; }

    /* Brand */
    .brand { text-align:center; margin-bottom:1.75rem; }
    .brand-logo { display:inline-flex; align-items:center; gap:10px; text-decoration:none; }
    .brand-icon { width:32px;height:32px; background:linear-gradient(135deg,#6366f1,#a78bfa); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:1rem; box-shadow:0 0 15px rgba(99,102,241,0.4); }
    .brand-name { font-size:1rem; font-weight:800; color:var(--text); }
    .brand-name span { color:var(--accent); }
  </style>
</head>

<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="auth-wrapper">
    <div class="auth-card">

      <!-- Brand -->
      <div class="brand">
        <a href="/index.html" class="brand-logo">
          <div class="brand-icon">🚀</div>
          <span class="brand-name">IISER <span>Smart Prep</span></span>
        </a>
      </div>

      <!-- Form state -->
      <div id="form-state">
        <div class="icon-badge">🔑</div>
        <div class="page-heading">
          <h2>Forgot password?</h2>
          <p>No worries! Enter your email and we'll send you a secure reset link.</p>
        </div>

        <form onsubmit="sendReset(event)">
          <div class="form-group">
            <label>Email Address</label>
            <div class="input-wrapper">
              <span class="input-icon">✉️</span>
              <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
            </div>
          </div>

          <div class="msg-box error" id="error-msg"></div>

          <button type="submit" class="btn-submit" id="send-btn">
            <span class="btn-inner">
              <div class="spinner" id="send-spin"></div>
              <span id="send-text">Send Reset Link →</span>
            </span>
          </button>
        </form>
      </div>

      <!-- Success state -->
      <div class="success-state" id="success-state">
        <div class="success-icon">📬</div>
        <h3>Check your inbox!</h3>
        <p>We've sent a password reset link to <strong id="sent-email"></strong>.<br>The link expires in <strong>1 hour</strong>.</p>
      </div>

      <div class="back-links">
        <a href="/login.html" class="back-link primary-link">← Back to Login</a>
        <a href="/index.html" class="back-link">Go to Home</a>
      </div>
    </div>
  </div>

  <script>
    async function sendReset(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const errEl = document.getElementById('error-msg');
      errEl.style.display = 'none';

      const btn = document.getElementById('send-btn');
      btn.disabled = true;
      document.getElementById('send-spin').style.display = 'block';
      document.getElementById('send-text').textContent = 'Sending...';

      try {
        const res = await fetch('https://api.iisersmartprep.space/api/forgot-password', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({email})
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Something went wrong');

        // Show success state
        document.getElementById('sent-email').textContent = email;
        document.getElementById('form-state').style.display = 'none';
        document.getElementById('success-state').style.display = 'block';

      } catch(err) {
        errEl.className = 'msg-box error';
        errEl.textContent = err.message;
        errEl.style.display = 'block';
        btn.disabled = false;
        document.getElementById('send-spin').style.display = 'none';
        document.getElementById('send-text').textContent = 'Send Reset Link →';
      }
    }
  </script>
</body>
</html>
