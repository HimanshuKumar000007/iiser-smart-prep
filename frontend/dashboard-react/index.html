    <script>
      // If loaded on a static server (e.g. Live Server) without Vite dev server active, redirect to the pre-bundled React dashboard
      const isVite = window.location.port === '3000' || window.location.port === '5173' || Boolean(window.__vite_plugin_react_preamble_installed__);
      if (!isVite && !window.location.pathname.includes('/dashboard-react/index.html')) {
        window.location.replace('/dashboard-react/index.html' + window.location.search + window.location.hash);

      if (!localStorage.getItem('IAT_TOKEN')) {

        window.location.replace(loginUrl);
      }
